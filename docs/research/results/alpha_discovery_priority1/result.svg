<text x="290" y="562" text-anchor="middle" class="metric">structural unique: 17/24</text>
<text x="290" y="584" text-anchor="middle" class="metric">semantic unique: 14/24</text>
<text x="290" y="606" text-anchor="middle" class="metric">best OOS Sharpe: 1.351</text>
<rect x="540" y="300.0" width="160" height="200.0" class="bar"/>
