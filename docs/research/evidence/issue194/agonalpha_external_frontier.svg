<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#fff"/>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;fill:#111827}
.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#4b5563}.h2{font-size:18px;font-weight:700}
