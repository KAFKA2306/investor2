name: Recover expired J-Quants day from private HF history

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/jquants-personal-cache-proof.yml

permissions:
  contents: read

jobs:
  recover-expired-day:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: k4fka/investor2-jquants-free-cache
      HF_HOME: /tmp/huggingface-personal-cache-recovery
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require owner credentials
        run: |
          test -n "$JQUANTS_API_KEY"
          test -n "$HF_TOKEN"
      - name: Install recovery dependencies
        run: |
          python -m pip install jquants-api-client huggingface-hub cryptography numpy pandas pyarrow requests
      - name: Recover 2024-05-31 from deleted private-HF history
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import pandas as pd
          from huggingface_hub import HfApi, hf_hub_download

          from scripts.alphazerobeta_jquants_private_hf_cache import (
              cache_path,
              derive_cache_key,
              download_cached_day,
              encode_day,
              encrypt_blob,
              ensure_private_personal_repo,
          )

          repo_id = os.environ['HF_DATASET_REPO']
          token = os.environ['HF_TOKEN']
          api_key = os.environ['JQUANTS_API_KEY']
          api = ensure_private_personal_repo(repo_id, token)
          target_date = pd.Timestamp('2024-05-31')
          target_path = cache_path(target_date)

          current_files = set(api.list_repo_files(repo_id=repo_id, repo_type='dataset'))
          if target_path not in current_files:
              candidates = []
              for commit in api.list_repo_commits(repo_id=repo_id, repo_type='dataset'):
                  commit_id = commit.commit_id
                  files = api.list_repo_files(repo_id=repo_id, repo_type='dataset', revision=commit_id)
                  for path in files:
                      if path.endswith('2024-05.parquet'):
                          candidates.append((commit_id, path))

              recovered = None
              recovery_source = None
              for commit_id, path in candidates:
                  try:
                      local = hf_hub_download(
                          repo_id=repo_id,
                          repo_type='dataset',
                          filename=path,
                          revision=commit_id,
                          token=token,
                      )
                      frame = pd.read_parquet(local)
                  except Exception:
                      continue
                  if 'Date' not in frame.columns:
                      continue
                  dates = pd.to_datetime(frame['Date'], errors='coerce').dt.tz_localize(None)
                  day = frame.loc[dates == target_date].copy()
                  if len(day) == 4357:
                      recovered = day
                      recovery_source = {'commit': commit_id, 'path': path}
                      break

              if recovered is None:
                  encrypted_candidates = []
                  for commit in api.list_repo_commits(repo_id=repo_id, repo_type='dataset'):
                      files = api.list_repo_files(
                          repo_id=repo_id,
                          repo_type='dataset',
                          revision=commit.commit_id,
                      )
                      encrypted_candidates.extend(
                          {'commit': commit.commit_id, 'path': path}
                          for path in files
                          if '2024-05' in path and path.endswith('.enc')
                      )
                  raise RuntimeError(
                      'no recoverable plaintext 2024-05-31 snapshot found in private HF history; '
                      f'plaintext_candidates={len(candidates)} encrypted_candidates={encrypted_candidates[:10]}'
                  )

              key = derive_cache_key(api_key)
              encrypted = encrypt_blob(
                  encode_day(recovered),
                  key=key,
                  aad=target_path.encode('utf-8'),
              )
              temp = Path('/tmp/2024-05-31.bin.enc')
              temp.write_bytes(encrypted)
              api.upload_file(
                  path_or_fileobj=str(temp),
                  path_in_repo=target_path,
                  repo_id=repo_id,
                  repo_type='dataset',
                  commit_message='recover expired personal J-Quants day 2024-05-31 from private history',
              )
          else:
              recovery_source = {'commit': 'already-current', 'path': target_path}

          verified = download_cached_day(repo_id, token, target_path, key=derive_cache_key(api_key))
          assert len(verified) == 4357, len(verified)
          assert set(pd.to_datetime(verified['Date']).dt.strftime('%Y-%m-%d')) == {'2024-05-31'}
          info = api.repo_info(repo_id=repo_id, repo_type='dataset')
          assert info.private is True
          print(json.dumps({
              'status': 'recovered',
              'date': '2024-05-31',
              'rows': len(verified),
              'target_path': target_path,
              'recovery_source': recovery_source,
              'hf_private': bool(info.private),
              'jquants_api_requests': 0,
          }, sort_keys=True))
          PY
      - name: Delete recovery working copies
        if: always()
        run: |
          rm -f /tmp/2024-05-31.bin.enc
          rm -rf /tmp/huggingface-personal-cache-recovery
