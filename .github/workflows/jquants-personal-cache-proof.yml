name: Seed and prove J-Quants personal cache

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/jquants-personal-cache-proof.yml

permissions:
  contents: read

jobs:
  seed-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: k4fka/investor2-jquants-free-cache
      HF_HOME: /tmp/huggingface-personal-cache-proof
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require owner credentials
        run: |
          test -n "$JQUANTS_API_KEY"
          test -n "$HF_TOKEN"
      - name: Install cache dependencies
        run: |
          python -m pip install jquants-api-client huggingface-hub cryptography numpy pandas pyarrow requests
      - name: Seed or resume owner-only encrypted private HF cache
        run: |
          rm -rf /tmp/jquants-cache-seed /tmp/jquants-cache-proof
          python scripts/alphazerobeta_jquants_private_hf_cache.py \
            --output-dir /tmp/jquants-cache-seed \
            --hf-repo-id "$HF_DATASET_REPO" \
            --as-of 2026-08-23 \
            --request-interval 15
          cp /tmp/jquants-cache-seed/manifest.json /tmp/jquants-cache-seed-manifest.json
      - name: Delete first plaintext materialization
        run: rm -rf /tmp/jquants-cache-seed
      - name: Materialize same window from HF with J-Quants disabled
        run: |
          rm -rf /tmp/jquants-cache-proof
          python scripts/alphazerobeta_jquants_private_hf_cache.py \
            --output-dir /tmp/jquants-cache-proof \
            --hf-repo-id "$HF_DATASET_REPO" \
            --as-of 2026-08-23 \
            --request-interval 15 \
            --require-cache-complete
      - name: Verify original full-window evidence and zero API reuse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          seed = json.loads(Path('/tmp/jquants-cache-seed-manifest.json').read_text())
          cached = json.loads(Path('/tmp/jquants-cache-proof/manifest.json').read_text())
          expected_range = {'start': '2024-05-31', 'end': '2026-05-29'}
          for manifest in (seed, cached):
              assert manifest['actual_date_range'] == expected_range
              assert manifest['price_rows'] == 2_050_816
              assert manifest['ticker_count'] == 4_640
              assert manifest['observed_market_days'] == 486
              assert manifest['cache']['visibility'] == 'private'
              assert manifest['cache']['plaintext_jquants_rows_on_hf'] is False
              assert manifest['external_distribution'] == 'none; private personal storage only'
          assert seed['files'] == cached['files']
          assert cached['request_count'] == 0
          assert cached['cache']['cache_misses'] == 0
          assert cached['cache']['cache_complete_after_run'] is True
          print(json.dumps({
              'status': 'passed',
              'actual_date_range': cached['actual_date_range'],
              'price_rows': cached['price_rows'],
              'ticker_count': cached['ticker_count'],
              'observed_market_days': cached['observed_market_days'],
              'seed_api_requests': seed['request_count'],
              'seed_cache_hits': seed['cache']['cache_hits'],
              'seed_cache_misses': seed['cache']['cache_misses'],
              'cache_only_api_requests': cached['request_count'],
              'cache_hits': cached['cache']['cache_hits'],
              'cache_misses': cached['cache']['cache_misses'],
              'visibility': cached['cache']['visibility'],
              'plaintext_jquants_rows_on_hf': cached['cache']['plaintext_jquants_rows_on_hf'],
          }, sort_keys=True))
          PY
      - name: Delete plaintext proof copies
        if: always()
        run: |
          rm -rf /tmp/jquants-cache-seed /tmp/jquants-cache-proof
          rm -f /tmp/jquants-cache-seed-manifest.json
          rm -rf /tmp/huggingface-personal-cache-proof
