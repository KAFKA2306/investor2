name: Bootstrap Quality Tooling

on:
  push:
    branches: ["chore/quality-gates-2026"]
    paths:
      - "package.json"
      - "pyproject.toml"
      - ".oxlintrc.json"
      - "config/biome.json"
      - ".github/workflows/bootstrap-quality-tooling.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Remove confirmed TypeScript lint residue
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/io/discord.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace("\tChannelType,\n", "")
          text = text.replace("\tMessageFlags,\n", "")
          text = re.sub(
              r"\n\t\tconst isPrivate =\n\t\t\tmessage\.channel\?\.type === ChannelType\.DM \|\|\n\t\t\tmessage\.channel\?\.type === ChannelType\.GroupDM;\n",
              "\n",
              text,
          )
          path.write_text(text, encoding="utf-8")
      - name: Refresh locks, format changed TS, generate baseline, and capture gates
        shell: bash
        run: |
          set +e
          report=quality-bootstrap-report.txt
          : > "$report"

          run_check() {
            name="$1"
            shift
            printf '\n===== %s =====\n' "$name" | tee -a "$report"
            "$@" >>"$report" 2>&1
            status=$?
            printf 'exit_code=%s\n' "$status" | tee -a "$report"
            return 0
          }

          run_check "bun lock" bun install --lockfile-only
          run_check "bun ci" bun ci
          run_check "biome write changed" bun run format
          run_check "biome changed check" bun run format:check
          run_check "oxlint" bun run lint
          run_check "typescript" bun run typecheck
          run_check "typescript tests" bun run test

          run_check "uv lock" uv lock
          if uv lock --check >/dev/null 2>&1; then
            run_check "uv quality sync" uv sync --locked --only-group dev
          fi

          if [ -x .venv/bin/pyrefly ]; then
            run_check "pyrefly baseline" uv run --no-sync pyrefly check --baseline=.pyrefly-baseline.json --update-baseline
            run_check "pyrefly check" uv run --no-sync pyrefly check
            run_check "ruff format" uv run --no-sync ruff format --check src scripts tests
            run_check "ruff lint" uv run --no-sync ruff check src scripts tests
          fi

          cat "$report"
      - name: Commit generated migration evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock uv.lock quality-bootstrap-report.txt src/io/discord.ts src/io/sector_data_fetcher.ts
          if [ -f .pyrefly-baseline.json ]; then
            git add .pyrefly-baseline.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "tooling: refresh locks and migration baseline"
          git pull --rebase origin chore/quality-gates-2026
          git push origin HEAD:chore/quality-gates-2026
