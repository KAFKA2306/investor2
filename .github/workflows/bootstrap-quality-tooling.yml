name: Bootstrap Quality Tooling

on:
  push:
    branches: ["chore/quality-gates-2026"]
    paths:
      - ".github/workflows/bootstrap-quality-tooling.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Verify and install locked dependencies
        run: |
          bun install --lockfile-only
          uv lock
          bun ci
          uv sync --locked --only-group dev
      - name: Format only migration TypeScript files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx')
          if [ "${#files[@]}" -gt 0 ]; then
            bun x biome check --write --config-path=config/biome.json "${files[@]}"
          fi
      - name: Commit deterministic generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock uv.lock scripts/quality_changed.ts src/io/discord.ts src/io/sector_data_fetcher.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "tooling: normalize migration files and locks"
          git pull --rebase origin chore/quality-gates-2026
          git push origin HEAD:chore/quality-gates-2026
      - name: Changed-file quality ratchet
        run: bun run quality:changed
      - name: TypeScript strict check
        run: bun run typecheck
      - name: Pyrefly strict check with migration baseline
        run: uv run --no-sync pyrefly check
      - name: TypeScript unit tests
        run: bun run test
      - name: External snapshot audit
        run: python3 scripts/snapshot_store.py audit
