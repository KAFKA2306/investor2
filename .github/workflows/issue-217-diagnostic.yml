name: Issue 217 diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"
      - run: bun ci
      - run: >-
          bun x biome check --config-path=config/biome.json
          src/decision/decision_ledger.ts tests/decision_ledger.test.ts

  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"
      - run: bun ci
      - run: >-
          bun x oxlint
          src/decision/decision_ledger.ts tests/decision_ledger.test.ts
