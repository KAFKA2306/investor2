name: Issue 217 diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality-changed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"
      - run: bun ci
      - run: bun run quality:changed

  typecheck-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"
      - run: bun ci
      - run: bun run typecheck

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"
      - run: bun ci
      - run: bun run test

  snapshot-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/snapshot_store.py audit
