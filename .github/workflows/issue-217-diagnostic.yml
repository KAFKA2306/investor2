name: Issue 217 diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  biome-write:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"
      - run: bun ci
      - run: >-
          bun x biome check --write --config-path=config/biome.json
          src/decision/decision_ledger.ts tests/decision_ledger.test.ts
      - name: Commit formatter output when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/decision/decision_ledger.ts tests/decision_ledger.test.ts
          git commit -m "style(decision): apply canonical Biome output"
          git push
