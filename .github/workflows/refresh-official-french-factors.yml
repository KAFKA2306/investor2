name: Refresh official French factor snapshot

on:
  push:
    paths:
      - "scripts/refresh_official_french_factors.py"
      - ".github/workflows/refresh-official-french-factors.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile refresher and suite
        run: |
          python -m py_compile scripts/refresh_official_french_factors.py
          python -m py_compile scripts/verify_paper_factor_suite.py

      - name: Fetch official source and materialize pinned snapshot
        run: python scripts/refresh_official_french_factors.py

      - name: Commit generated canonical evidence to source branch
        if: github.ref_type == 'branch'
        run: |
          git add -f \
            docs/research/data/ff3_1992_2026-06.csv \
            docs/research/data/ff5_2015_2026-06.csv
          git add \
            docs/research/kenneth_french_current_snapshot_2026-06.json \
            docs/research/paper_factor_registry.json \
            docs/research/official_current_paper_factor_suite.json \
            docs/research/official_current_paper_factor_suite.md
          git add -u docs/research/data/ff3_1992_2020.csv docs/research/data/ff5_2015_2020.csv
          if git diff --cached --quiet; then
            echo "Official snapshot already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: pin official French factors through 2026-06"
          git push origin "HEAD:${GITHUB_REF_NAME}"
