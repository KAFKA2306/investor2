name: Temporary format U.S. MMF collector

on:
  push:
    branches:
      - automation/us-mmf-refresh-20260820

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/us-mmf-refresh-20260820
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.15.5'
      - name: Format and fix
        run: |
          ruff format scripts/update_us_mmf_history.py
          ruff check --fix scripts/update_us_mmf_history.py
      - name: Commit formatter output
        run: |
          if git diff --quiet -- scripts/update_us_mmf_history.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/update_us_mmf_history.py
          git commit -m 'style: format US MMF collector'
          git push origin HEAD:automation/us-mmf-refresh-20260820
