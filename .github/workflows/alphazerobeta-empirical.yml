name: AlphaZeroBeta empirical validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/alphazerobeta-empirical
    paths:
      - scripts/alphazerobeta_empirical_run.py
      - scripts/alphazerobeta_prepare.py
      - scripts/alphazerobeta_train.py
      - scripts/alphazerobeta_evaluate.py
      - scripts/alphazerobeta_compare.py
      - src/research/alphazerobeta.py
      - tests/test_alphazerobeta.py
      - tests/test_alphazerobeta_timing.py
      - data/hypothesis_lab/hypotheses/alphazerobeta_market_neutral_v1.json
      - .github/workflows/alphazerobeta-empirical.yml

permissions:
  contents: write

concurrency:
  group: alphazerobeta-empirical-${{ github.ref }}
  cancel-in-progress: false

jobs:
  empirical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas torch pytest ruff

      - name: Normalize empirical Python quality
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/alphazerobeta_empirical_run.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n",
              "from pathlib import Path\nfrom typing import Any\n\nimport pandas as pd\n",
          )
          text = text.replace(
              "def read_json(path: Path) -> dict[str, object]:",
              "def read_json(path: Path) -> dict[str, Any]:",
          )
          text = text.replace(
              '    primary_return = float(primary["cumulative_return"])\n'
              '    ablation_return = float(ablation["cumulative_return"])\n'
              "    summary = {\n",
              '    primary_return = float(primary["cumulative_return"])\n'
              '    ablation_return = float(ablation["cumulative_return"])\n'
              "    primary_money_scaling = [money(primary_return, 1_000_000.0), money(primary_return, 10_000_000.0)]\n"
              "    ablation_money_scaling = [money(ablation_return, 1_000_000.0), money(ablation_return, 10_000_000.0)]\n"
              "    summary = {\n",
          )
          text = text.replace(
              '        "primary_money_scaling": [money(primary_return, 1_000_000.0), money(primary_return, 10_000_000.0)],\n',
              '        "primary_money_scaling": primary_money_scaling,\n',
          )
          text = text.replace(
              '        "ablation_money_scaling": [money(ablation_return, 1_000_000.0), money(ablation_return, 10_000_000.0)],\n',
              '        "ablation_money_scaling": ablation_money_scaling,\n',
          )
          text = text.replace(
              '    p_money = summary["primary_money_scaling"]\n'
              '    a_money = summary["ablation_money_scaling"]\n'
              "    assert isinstance(p_money, list) and isinstance(a_money, list)\n",
              "    p_money = primary_money_scaling\n"
              "    a_money = ablation_money_scaling\n",
          )
          path.write_text(text, encoding="utf-8")
          PY
          ruff format scripts/alphazerobeta_empirical_run.py scripts/alphazerobeta_train.py tests/test_alphazerobeta_timing.py
          ruff check --fix scripts/alphazerobeta_empirical_run.py scripts/alphazerobeta_train.py tests/test_alphazerobeta_timing.py

      - name: Verify AlphaZeroBeta unit and timing contracts
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_alphazerobeta.py tests/test_alphazerobeta_timing.py

      - name: Execute empirical validation
        id: empirical
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set +e
          python scripts/alphazerobeta_empirical_run.py \
            --output-dir docs/research/results/alphazerobeta_2024
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist normalized code and result or failure evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/alphazerobeta_empirical_run.py \
            scripts/alphazerobeta_train.py \
            tests/test_alphazerobeta_timing.py \
            docs/research/results/alphazerobeta_2024
          if git diff --cached --quiet; then
            echo "No empirical artifact changes to commit"
          else
            git commit -m "research: persist AlphaZeroBeta empirical evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Require empirical execution success
        env:
          EMPIRICAL_EXIT_CODE: ${{ steps.empirical.outputs.exit_code }}
        run: |
          test "$EMPIRICAL_EXIT_CODE" = "0"
