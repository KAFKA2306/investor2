name: Build and deploy modular evidence browser

on:
  pull_request:
    paths:
      - "pages/**"
      - "docs/**"
      - "data/**"
      - "generated/**"
      - "api/**"
      - "scripts/build_pages_site.py"
      - "tests/test_build_pages_site.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/live-pages-smoke.yml"
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "docs/**"
      - "data/**"
      - "generated/**"
      - "api/**"
      - "scripts/build_pages_site.py"
      - "tests/test_build_pages_site.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/live-pages-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build and validate candidate site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Prove automatic discovery contract
        run: python -m pytest -q tests/test_build_pages_site.py

      - name: Build candidate site
        run: |
          set -euo pipefail
          rm -rf _site validation-report
          python scripts/build_pages_site.py \
            --output _site \
            --repository "${GITHUB_REPOSITORY}" \
            --revision "${GITHUB_SHA}"

      - name: Inspect candidate structure
        run: |
          set -euo pipefail
          mkdir -p validation-report
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_revision = os.environ["GITHUB_SHA"]
          manifest = json.loads(Path("_site/manifest.json").read_text(encoding="utf-8"))
          revision = json.loads(Path("_site/revision.json").read_text(encoding="utf-8"))
          assert manifest["revision"] == expected_revision
          assert revision["revision"] == expected_revision
          assert revision["artifact_count"] == manifest["totals"]["artifacts"]
          assert revision["artifact_count"] == len(manifest["artifacts"])
          assert manifest["content_roots"] == ["docs", "data", "generated", "api"]
          assert all(manifest["totals"]["categories"].get(root, 0) > 0 for root in manifest["content_roots"])
          assert len({item["path"] for item in manifest["artifacts"]}) == len(manifest["artifacts"])
          for item in manifest["artifacts"]:
              if item["local_url"]:
                  assert (Path("_site") / item["local_url"]).is_file(), item["path"]
          Path("validation-report/artifact-count.txt").write_text(
              f"{revision['artifact_count']}\n", encoding="utf-8"
          )
          PY

      - name: Serve and smoke-test candidate site
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory _site >validation-report/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ \
                -o validation-report/index.html; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "candidate HTTP server did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/manifest.json \
            -o validation-report/manifest.json
          curl --fail --silent --show-error http://127.0.0.1:4173/revision.json \
            -o validation-report/revision.json
          curl --fail --silent --show-error http://127.0.0.1:4173/app.js \
            -o validation-report/app.js
          curl --fail --silent --show-error http://127.0.0.1:4173/styles.css \
            -o validation-report/styles.css
          first_local_url="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('_site/manifest.json').read_text(encoding='utf-8'))
          print(next(item['local_url'] for item in manifest['artifacts'] if item['local_url']))
          PY
          )"
          curl --fail --silent --show-error \
            "http://127.0.0.1:4173/${first_local_url}" \
            -o validation-report/first-artifact
          grep -Fq 'investor2 Evidence Browser' validation-report/index.html
          grep -Fq 'manifest.json' validation-report/app.js

      - name: Upload candidate validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: pages-candidate-validation-${{ github.sha }}
          path: validation-report
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy production Pages
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
