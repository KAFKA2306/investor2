name: Validate and deploy AAARTS evidence dashboard

on:
  pull_request:
    paths:
      - "docs/aaarts-dashboard/**"
      - "docs/research/**"
      - "scripts/build_research_verification_manifest.py"
      - "scripts/validate_research_dashboard.py"
      - "scripts/verify_paper_factor_suite.py"
      - "scripts/daily_trump_chart.py"
      - "tests/test_research_verification_manifest.py"
      - "tests/test_research_dashboard_validation.py"
      - "tests/test_paper_factor_suite.py"
      - "tests/test_daily_trump_chart.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/daily-trump-chart.yml"
  push:
    branches: [main]
    paths:
      - "docs/aaarts-dashboard/**"
      - "docs/research/**"
      - "scripts/build_research_verification_manifest.py"
      - "scripts/validate_research_dashboard.py"
      - "scripts/verify_paper_factor_suite.py"
      - "scripts/daily_trump_chart.py"
      - "tests/test_research_verification_manifest.py"
      - "tests/test_research_dashboard_validation.py"
      - "tests/test_paper_factor_suite.py"
      - "tests/test_daily_trump_chart.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/daily-trump-chart.yml"
      - "generated/trump-daily-chart/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-candidate:
    name: Validate candidate artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test/runtime dependencies
        run: python -m pip install --disable-pip-version-check pytest matplotlib

      - name: Validate empirical research artifacts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_paper_factor_suite.py \
            tests/test_repeated_paper_validation.py \
            tests/test_research_verification_manifest.py \
            tests/test_research_dashboard_validation.py \
            tests/test_daily_trump_chart.py

      - name: Assemble candidate site
        run: |
          set -euo pipefail
          rm -rf _site validation-report
          mkdir -p _site/data _site/trump-daily-chart validation-report
          python scripts/build_research_verification_manifest.py \
            --output _site/data/research_verification_manifest.json
          python scripts/daily_trump_chart.py --output-dir _site/trump-daily-chart
          cp docs/aaarts-dashboard/index.html _site/index.html
          touch _site/.nojekyll

      - name: Serve and validate candidate site
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory _site >validation-report/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ -o validation-report/candidate-index.html; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "candidate HTTP server did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            http://127.0.0.1:4173/data/research_verification_manifest.json \
            -o validation-report/candidate-manifest.json
          curl --fail --silent --show-error \
            http://127.0.0.1:4173/trump-daily-chart/ \
            -o validation-report/trump-daily-chart-index.html
          curl --fail --silent --show-error \
            http://127.0.0.1:4173/trump-daily-chart/summary.json \
            -o validation-report/trump-daily-chart-summary.json
          python scripts/validate_research_dashboard.py \
            --manifest validation-report/candidate-manifest.json \
            --html validation-report/candidate-index.html \
            --expected-revision "${GITHUB_SHA}" \
            --report validation-report/candidate-validation.json

      - name: Upload candidate validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: pages-candidate-validation-${{ github.sha }}
          path: validation-report
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy production Pages
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-candidate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
