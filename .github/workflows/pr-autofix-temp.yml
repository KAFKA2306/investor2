name: Temporary PR autofix

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - run: |
          bun ci
          uv sync --locked --only-group dev
          bunx biome format --write pages/app.js
          uv run --no-sync ruff format \
            scripts/alphazerobeta_empirical_run.py \
            scripts/build_pages_site.py \
            src/commands/bench_eval.py \
            tests/test_alphazerobeta_timing.py \
            tests/test_build_pages_site.py
          uv run --no-sync ruff check --fix \
            scripts/alphazerobeta_empirical_run.py \
            scripts/build_pages_site.py \
            src/commands/bench_eval.py \
            tests/test_alphazerobeta_timing.py \
            tests/test_build_pages_site.py
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/app.js scripts/alphazerobeta_empirical_run.py scripts/build_pages_site.py src/commands/bench_eval.py tests/test_alphazerobeta_timing.py tests/test_build_pages_site.py
          git commit -m "style: apply repository formatters"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
