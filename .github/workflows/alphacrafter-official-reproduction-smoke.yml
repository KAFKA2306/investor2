name: AlphaCrafter official reproduction smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  upstream-unmodified-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout investor2
        uses: actions/checkout@v4
      - name: Checkout pinned official AlphaCrafter
        uses: actions/checkout@v4
        with:
          repository: NJU-LINK/AlphaCrafter
          ref: c6dbc1ba4e0a4ecbc3ea1454c5290dbea4b36b0d
          path: upstream
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install upstream runtime and package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install openai python-dotenv pydantic requests pyyaml pandas numpy scikit-learn matplotlib seaborn tqdm lightgbm
          python -m pip install -e upstream
      - name: Run pinned upstream code through its actual CLI
        env:
          OPENAI_API_KEY: dummy-not-used-for-real-reproduction
          OPENAI_API_URL: https://api.openai.com/v1
        run: |
          set -euo pipefail
          cd upstream/alphacrafter
          rm -rf sandbox/gpt-5.3-backtest-csi300
          cp -a sandbox/template_a sandbox/gpt-5.3-backtest-csi300
          set +e
          python main.py gpt-5.3-backtest-csi300 > /tmp/alphacrafter-upstream-smoke.log 2>&1
          exit_code=$?
          set -e
          cat /tmp/alphacrafter-upstream-smoke.log
          export EXIT_CODE="$exit_code"
          python - <<'PY'
          import json, os
          from pathlib import Path
          log = Path('/tmp/alphacrafter-upstream-smoke.log').read_text(errors='replace')
          if "Model 'gpt-5.3-codex' not found in config" in log:
              blocker = "config.yaml requests gpt-5.3-codex but session models.json defines only gpt-5 and gpt-5.2"
              status = 'BLOCKED_MODEL_REGISTRY'
          elif '401' in log or 'AuthenticationError' in log or 'Incorrect API key' in log:
              blocker = 'startup passed local configuration and reached the OpenAI API with the deliberately invalid smoke key'
              status = 'REACHED_LLM_API'
          elif 'unrecognized arguments: --session_id' in log:
              blocker = 'README CLI disagrees with code: README documents --session_id but argparse requires positional session_id'
              status = 'BLOCKED_README_CLI_MISMATCH'
          else:
              blocker = 'unexpected upstream startup blocker; inspect captured log'
              status = 'BLOCKED_OTHER'
          evidence = {
              'schema_version': 'investor2.alphacrafter.official-smoke.v3',
              'upstream_repository': 'NJU-LINK/AlphaCrafter',
              'upstream_commit': 'c6dbc1ba4e0a4ecbc3ea1454c5290dbea4b36b0d',
              'mode': 'official_upstream_code_no_semantic_patch',
              'readme_cli_mismatch_observed_in_prior_run': True,
              'actual_cli': 'python main.py <session_id>',
              'process_exit_code': int(os.environ['EXIT_CODE']),
              'status': status,
              'blocker': blocker,
              'frontier_evidence': False,
              'next_step': 'Resolve only the first upstream reproducibility blocker, then rerun; do not replace the official Miner/Screener/Trader workflow with a surrogate.'
          }
          Path('/tmp/alphacrafter-official-smoke.json').write_text(json.dumps(evidence, indent=2) + '\n')
          if int(os.environ['EXIT_CODE']) == 0:
              raise SystemExit('Smoke unexpectedly completed with a dummy API key; inspect run semantics')
          PY
      - name: Record whether required OpenAI secrets exist
        if: always()
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_URL: ${{ secrets.OPENAI_API_URL }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('/tmp/alphacrafter-secret-readiness.json').write_text(json.dumps({
              'OPENAI_API_KEY_present': bool(os.environ.get('OPENAI_KEY')),
              'OPENAI_API_URL_present': bool(os.environ.get('OPENAI_URL')),
          }, indent=2) + '\n')
          PY
      - name: Upload official reproduction smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphacrafter-official-reproduction-smoke
          path: |
            /tmp/alphacrafter-upstream-smoke.log
            /tmp/alphacrafter-official-smoke.json
            /tmp/alphacrafter-secret-readiness.json
          if-no-files-found: error
