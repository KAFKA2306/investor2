name: AlphaCrafter official reproduction smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  official-upstream-compatibility-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout investor2
        uses: actions/checkout@v4
      - name: Checkout pinned official AlphaCrafter
        uses: actions/checkout@v4
        with:
          repository: NJU-LINK/AlphaCrafter
          ref: c6dbc1ba4e0a4ecbc3ea1454c5290dbea4b36b0d
          path: upstream
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install upstream runtime and package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install openai python-dotenv pydantic requests pyyaml pandas numpy scikit-learn matplotlib seaborn tqdm lightgbm
          python -m pip install -e upstream
      - name: Create official template session and apply registry-only compatibility fix
        run: |
          set -euo pipefail
          cd upstream/alphacrafter
          rm -rf sandbox/gpt-5.3-backtest-csi300
          cp -a sandbox/template_a sandbox/gpt-5.3-backtest-csi300
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('sandbox/gpt-5.3-backtest-csi300/config/models.json')
          cfg = json.loads(p.read_text())
          assert 'gpt-5.3-codex' not in cfg
          # Compatibility metadata only. No agent instructions, tools, gates, workflow,
          # trading logic, or data semantics are changed.
          cfg['gpt-5.3-codex'] = {
              'producer': 'OpenAI',
              'inputs': ['text'],
              'cost': {'input': 0, 'output': 0},
              'input_token_limit': 128000,
              'output_token_limit': 32000
          }
          p.write_text(json.dumps(cfg, indent=4) + '\n')
          PY
      - name: Run official Miner-Screener-Trader pipeline until external API boundary
        env:
          OPENAI_API_KEY: deliberately-invalid-smoke-key
          OPENAI_API_URL: https://api.openai.com/v1
        run: |
          set -euo pipefail
          cd upstream/alphacrafter
          set +e
          python main.py gpt-5.3-backtest-csi300 > /tmp/alphacrafter-upstream-smoke.log 2>&1
          exit_code=$?
          set -e
          cat /tmp/alphacrafter-upstream-smoke.log
          export EXIT_CODE="$exit_code"
          python - <<'PY'
          import json, os
          from pathlib import Path
          log = Path('/tmp/alphacrafter-upstream-smoke.log').read_text(errors='replace')
          auth_markers = ('401', 'AuthenticationError', 'Incorrect API key', 'invalid_api_key')
          if any(marker in log for marker in auth_markers):
              status = 'REACHED_LLM_API'
              blocker = 'official pipeline initialized after registry-only fix and reached the OpenAI API; deliberately invalid smoke credential was rejected'
          elif "Model 'gpt-5.3-codex' not found in config" in log:
              status = 'REGISTRY_FIX_FAILED'
              blocker = 'session-local model registry compatibility fix did not take effect'
          else:
              status = 'BLOCKED_OTHER'
              blocker = 'next official-pipeline blocker occurred before confirmed authentication boundary; inspect log'
          evidence = {
              'schema_version': 'investor2.alphacrafter.official-smoke.v4',
              'upstream_repository': 'NJU-LINK/AlphaCrafter',
              'upstream_commit': 'c6dbc1ba4e0a4ecbc3ea1454c5290dbea4b36b0d',
              'upstream_source_modified': False,
              'session_local_compatibility_patch': {
                  'file': 'sandbox/gpt-5.3-backtest-csi300/config/models.json',
                  'change': 'add missing gpt-5.3-codex model metadata entry only',
                  'semantic_agent_changes': False
              },
              'process_exit_code': int(os.environ['EXIT_CODE']),
              'status': status,
              'blocker': blocker,
              'frontier_evidence': False
          }
          Path('/tmp/alphacrafter-official-smoke.json').write_text(json.dumps(evidence, indent=2) + '\n')
          if int(os.environ['EXIT_CODE']) == 0:
              raise SystemExit('Smoke unexpectedly completed with deliberately invalid API credential')
          PY
      - name: Record repository secret readiness
        if: always()
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_URL: ${{ secrets.OPENAI_API_URL }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('/tmp/alphacrafter-secret-readiness.json').write_text(json.dumps({
              'OPENAI_API_KEY_present': bool(os.environ.get('OPENAI_KEY')),
              'OPENAI_API_URL_present': bool(os.environ.get('OPENAI_URL')),
              'full_llm_reproduction_ready': bool(os.environ.get('OPENAI_KEY'))
          }, indent=2) + '\n')
          PY
      - name: Upload official reproduction smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphacrafter-official-reproduction-smoke
          path: |
            /tmp/alphacrafter-upstream-smoke.log
            /tmp/alphacrafter-official-smoke.json
            /tmp/alphacrafter-secret-readiness.json
          if-no-files-found: error
