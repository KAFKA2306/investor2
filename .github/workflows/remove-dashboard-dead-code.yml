name: Remove dashboard dead code

on:
  push:
    branches:
      - refactor/remove-historical-dashboard-compat

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/remove-historical-dashboard-compat
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install locked dependencies
        run: bun ci
      - name: Remove exposed dead code
        run: python scripts/remove_dashboard_dead_code.py
      - name: Format and lint result
        run: |
          bunx biome format --write --config-path=config/biome.json src/dashboard/server.ts
          bunx oxlint src/dashboard/server.ts
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "refactor: remove dashboard dead code"
          git push origin HEAD:refactor/remove-historical-dashboard-compat
