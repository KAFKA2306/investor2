name: Repository Ratchet

on:
  pull_request:
    paths:
      - "README.md"
      - "Taskfile.yml"
      - "docs/architecture/**"
      - "docs/research/hypothesis-lab.md"
      - "tests/test_repository_ratchet.py"
      - "tests/test_bench_contract.py"
      - ".github/workflows/**"
      - "data/input_ledger/**"
      - "data/hypothesis_lab/**"
      - "data/decision_ledger/**"
      - "data/benchmarks/**"
      - "src/research/**"
      - "src/decision/**"
      - "src/commands/bench_contract.py"
      - "src/commands/bench_eval.py"
      - "src/commands/bench_ablation.py"
      - "ontology/project.yaml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "Taskfile.yml"
      - "docs/architecture/**"
      - "docs/research/hypothesis-lab.md"
      - "tests/test_repository_ratchet.py"
      - "tests/test_bench_contract.py"
      - ".github/workflows/**"
      - "data/input_ledger/**"
      - "data/hypothesis_lab/**"
      - "data/decision_ledger/**"
      - "data/benchmarks/**"
      - "src/research/**"
      - "src/decision/**"
      - "src/commands/bench_contract.py"
      - "src/commands/bench_eval.py"
      - "src/commands/bench_ablation.py"
      - "ontology/project.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify canonical repository flow
        run: python tests/test_repository_ratchet.py
      - name: Verify benchmark fail-closed contract
        run: python -m unittest tests.test_bench_contract
      - name: Verify clean checkout
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
