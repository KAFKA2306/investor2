name: Market data source contracts

on:
  pull_request:
    paths:
      - 'src/io/market_data_sources.py'
      - 'scripts/build_edinet_issuer_master.py'
      - 'scripts/fetch_edinet_filings.py'
      - 'scripts/ingest_gdelt_news.py'
      - 'scripts/query_market_news.py'
      - 'scripts/verify_alpha_vantage.py'
      - 'tests/test_market_data_sources.py'
      - 'data/input_ledger/source_registry.json'
      - 'docs/data-sources/market-universe.md'
      - '.github/workflows/market-data-source-contracts.yml'
      - '.github/workflows/edinet-issuer-master-update.yml'
  push:
    branches: [main]
    paths:
      - 'src/io/market_data_sources.py'
      - 'scripts/build_edinet_issuer_master.py'
      - 'scripts/fetch_edinet_filings.py'
      - 'scripts/ingest_gdelt_news.py'
      - 'scripts/query_market_news.py'
      - 'scripts/verify_alpha_vantage.py'
      - 'tests/test_market_data_sources.py'
      - 'data/input_ledger/source_registry.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m pytest -q tests/test_market_data_sources.py
      - run: >-
          uv run ruff check
          src/io/market_data_sources.py
          scripts/build_edinet_issuer_master.py
          scripts/fetch_edinet_filings.py
          scripts/ingest_gdelt_news.py
          scripts/query_market_news.py
          scripts/verify_alpha_vantage.py
          tests/test_market_data_sources.py

  edinet-live-master-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m scripts.build_edinet_issuer_master --output /tmp/edinet.json --diff-output /tmp/edinet-diff.json
      - run: >-
          uv run python -c
          "import json; d=json.load(open('/tmp/edinet.json')); assert d['issuer_count'] > 1000; print(d['issuer_count'], d['source_sha256'])"

  gdelt-live-discovery-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m scripts.build_edinet_issuer_master --output /tmp/edinet.json --diff-output /tmp/edinet-diff.json
      - run: uv run python -m scripts.ingest_gdelt_news --issuer-master /tmp/edinet.json --output /tmp/gdelt.json
      - run: >-
          uv run python -c
          "import json; d=json.load(open('/tmp/gdelt.json')); assert d['schema_version']=='investor2.gdelt-company-news-discovery.v1'; assert len(d['source_sha256'])==64; print(d['event_count'], d['source_url'])"
