name: QQQ gold daily validation

on:
  pull_request:
    paths:
      - "scripts/qqq_gold_daily_validate.py"
      - ".github/workflows/qqq-gold-daily-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Install locked project
        run: uv sync --locked
      - name: Run daily total-return validation
        run: uv run python scripts/qqq_gold_daily_validate.py
