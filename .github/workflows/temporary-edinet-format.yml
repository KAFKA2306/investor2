name: Temporary EDINET formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.5
      - name: Apply canonical Ruff formatting
        run: |
          ruff format scripts/edinet_bench_logistic.py tests/test_edinet_bench_logistic.py
          ruff check --fix scripts/edinet_bench_logistic.py tests/test_edinet_bench_logistic.py
          if git diff --quiet -- scripts/edinet_bench_logistic.py tests/test_edinet_bench_logistic.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/edinet_bench_logistic.py tests/test_edinet_bench_logistic.py
          git commit -m "style: format EDINET-Bench reproduction"
          git push origin HEAD:${{ github.head_ref }}
