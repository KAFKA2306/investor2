name: Temporary skfolio format diagnostic

on:
  push:
    branches:
      - research/skfolio-jquants-oos

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - run: uv sync --locked
      - name: Format, lint and test with diff
        shell: bash
        run: |
          set -uo pipefail
          uv run ruff format scripts/skfolio_jquants_oos.py tests/test_skfolio_jquants_oos.py tests/test_skfolio_characteristics.py
          echo '--- RUFF FORMAT DIFF ---'
          git diff -- scripts/skfolio_jquants_oos.py tests/test_skfolio_jquants_oos.py tests/test_skfolio_characteristics.py
          format_changed=0
          git diff --quiet -- scripts/skfolio_jquants_oos.py tests/test_skfolio_jquants_oos.py tests/test_skfolio_characteristics.py || format_changed=1
          uv run ruff check scripts/skfolio_jquants_oos.py tests/test_skfolio_jquants_oos.py tests/test_skfolio_characteristics.py
          lint_status=$?
          uv run pytest -q tests/test_skfolio_characteristics.py tests/test_skfolio_jquants_oos.py
          test_status=$?
          if [ "$format_changed" -ne 0 ] || [ "$lint_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            exit 1
          fi
