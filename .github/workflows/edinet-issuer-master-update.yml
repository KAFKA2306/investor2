name: Update EDINET issuer master

on:
  push:
    branches: [main]
    paths:
      - 'src/io/market_data_sources.py'
      - 'scripts/build_edinet_issuer_master.py'
      - '.github/workflows/edinet-issuer-master-update.yml'
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edinet-issuer-master-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python scripts/build_edinet_issuer_master.py
      - run: >-
          uv run python -c
          "import json; d=json.load(open('data/market/edinet_issuer_master.json')); assert d['issuer_count'] > 1000; assert len(d['source_sha256'])==64"
      - name: Commit changed master only
        run: |
          if git diff --quiet -- data/market/edinet_issuer_master.json data/market/edinet_issuer_master_diff.json; then
            echo 'EDINET issuer master unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market/edinet_issuer_master.json data/market/edinet_issuer_master_diff.json
          git commit -m 'data: update EDINET issuer master'
          git push
