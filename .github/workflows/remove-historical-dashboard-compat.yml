name: Remove historical dashboard compatibility

on:
  push:
    branches:
      - refactor/remove-historical-dashboard-compat

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/remove-historical-dashboard-compat
          fetch-depth: 0
      - name: Apply bounded cleanup
        run: python scripts/remove_historical_dashboard_compat.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "refactor: remove historical dashboard compatibility"
          git push origin HEAD:refactor/remove-historical-dashboard-compat
