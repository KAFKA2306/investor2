name: Market data autofix temp

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/io/market_data_sources.py'
      - 'scripts/build_edinet_issuer_master.py'
      - 'scripts/fetch_edinet_filings.py'
      - 'scripts/ingest_gdelt_news.py'
      - 'tests/test_market_data_sources.py'
      - '.github/workflows/market-data-autofix-temp.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
      - name: Fix strict typing and format
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/fetch_edinet_filings.py')
          text = p.read_text()
          old = '''    state = (\n        json.loads(state_path.read_text())\n        if state_path.exists()\n        else {"known_doc_ids": []}\n    )\n'''
          new = '''    if state_path.exists():\n        state: dict[str, object] = json.loads(state_path.read_text())\n    else:\n        state = {"known_doc_ids": list[str]()}\n'''
          if old in text:
              text = text.replace(old, new)
              p.write_text(text)
          PY
          uv run ruff format \
            src/io/market_data_sources.py \
            scripts/build_edinet_issuer_master.py \
            scripts/fetch_edinet_filings.py \
            scripts/ingest_gdelt_news.py \
            scripts/query_market_news.py \
            scripts/verify_alpha_vantage.py \
            tests/test_market_data_sources.py
          uv run ruff check \
            src/io/market_data_sources.py \
            scripts/build_edinet_issuer_master.py \
            scripts/fetch_edinet_filings.py \
            scripts/ingest_gdelt_news.py \
            scripts/query_market_news.py \
            scripts/verify_alpha_vantage.py \
            tests/test_market_data_sources.py
      - name: Commit autofix
        run: |
          if git diff --quiet; then
            echo 'No formatting changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/io/market_data_sources.py scripts tests/test_market_data_sources.py
          git commit -m 'style: format market data source implementation'
          git push origin HEAD:${{ github.head_ref }}
