name: Memenote research reproduction

on:
  pull_request:
    paths:
      - "scripts/verify_memenote_research.py"
      - "tests/test_memenote_research.py"
      - "data/research/memenote/**"
      - "docs/research/results/alphazerobeta_2024/raw/prices.csv"
      - "docs/research/results/alphazerobeta_2024/source_manifest.json"
      - "data/ark-big-ideas/snapshots/bitcoin-derivatives-daily/**"
      - ".github/workflows/memenote-research.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Install formatter
        run: uv sync --locked --only-group dev
      - name: Apply canonical formatting to research files
        run: |
          uv run --no-sync ruff format scripts/verify_memenote_research.py tests/test_memenote_research.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_memenote_research.py tests/test_memenote_research.py
          if ! git diff --cached --quiet; then
            git commit -m "style: apply canonical ruff formatting"
            git push origin HEAD:${{ github.head_ref }}
          fi
