name: J-Quants HF record purge

on:
  push:
    branches:
      - ops/jquants-hf-plaintext-cleanup
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jquants-hf-record-purge
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: k4fka/investor2-jquants-free-cache
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require Hugging Face credential
        run: test -n "$HF_TOKEN"
      - name: Purge externally stored J-Quants records
        run: |
          python -m pip install huggingface-hub
          python - <<'PY'
          import json
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_REPO_ID"]
          before = sorted(api.list_repo_files(repo_id=repo_id, repo_type="dataset"))
          records = [path for path in before if path.startswith("staging/") or path.startswith("snapshots/")]
          print(json.dumps({"record_objects_before": records}, sort_keys=True))
          for path in records:
              api.delete_file(
                  path_in_repo=path,
                  repo_id=repo_id,
                  repo_type="dataset",
                  commit_message=f"purge externally stored J-Quants record {path}",
              )
          after = sorted(api.list_repo_files(repo_id=repo_id, repo_type="dataset"))
          remaining = [path for path in after if path.startswith("staging/") or path.startswith("snapshots/")]
          print(json.dumps({"deleted_count": len(records), "remaining_record_objects": remaining}, sort_keys=True))
          if remaining:
              raise SystemExit(f"J-Quants record objects remain on Hugging Face: {remaining}")
          PY
