name: J-Quants HF plaintext cleanup

on:
  push:
    branches:
      - ops/jquants-hf-plaintext-cleanup
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jquants-hf-plaintext-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: k4fka/investor2-jquants-free-cache
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require Hugging Face credential
        run: test -n "$HF_TOKEN"
      - name: Remove legacy plaintext J-Quants cache objects
        run: |
          python -m pip install huggingface-hub
          python - <<'PY'
          import json
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_REPO_ID"]
          raw_suffixes = (".parquet", ".csv", ".feather", ".arrow", ".jsonl", ".ndjson", ".npz")

          def is_plaintext_raw(path: str) -> bool:
              lower = path.lower()
              if lower.endswith(".enc"):
                  return False
              if not lower.endswith(raw_suffixes):
                  return False
              return (
                  path.startswith("staging/")
                  or "/.staging/" in path
                  or path.startswith("snapshots/")
              )

          before = api.list_repo_files(repo_id=repo_id, repo_type="dataset")
          candidates = sorted(path for path in before if is_plaintext_raw(path))
          print(json.dumps({"plaintext_candidates": candidates}, sort_keys=True))
          for path in candidates:
              api.delete_file(
                  path_in_repo=path,
                  repo_id=repo_id,
                  repo_type="dataset",
                  commit_message=f"remove legacy plaintext J-Quants cache object {path}",
              )

          after = api.list_repo_files(repo_id=repo_id, repo_type="dataset")
          remaining = sorted(path for path in after if is_plaintext_raw(path))
          print(json.dumps({"deleted_count": len(candidates), "remaining_plaintext": remaining}, sort_keys=True))
          if remaining:
              raise SystemExit(f"plaintext raw J-Quants cache objects remain: {remaining}")
          PY
