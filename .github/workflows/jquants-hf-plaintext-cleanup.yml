name: J-Quants HF cache audit

on:
  push:
    branches:
      - ops/jquants-hf-plaintext-cleanup
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jquants-hf-cache-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: k4fka/investor2-jquants-free-cache
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require Hugging Face credential
        run: test -n "$HF_TOKEN"
      - name: Audit encrypted checkpoint progress and plaintext absence
        run: |
          python -m pip install huggingface-hub
          python - <<'PY'
          import json
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_REPO_ID"]
          files = sorted(api.list_repo_files(repo_id=repo_id, repo_type="dataset"))
          raw_suffixes = (".parquet", ".csv", ".feather", ".arrow", ".jsonl", ".ndjson", ".npz")
          plaintext = [
              path for path in files
              if not path.lower().endswith(".enc")
              and path.lower().endswith(raw_suffixes)
              and (path.startswith("staging/") or "/.staging/" in path or path.startswith("snapshots/"))
          ]
          encrypted_months = [
              path for path in files
              if path.startswith("staging/asof-2026-08-23/prices/") and path.endswith(".parquet.enc")
          ]
          snapshot_files = [path for path in files if path.startswith("snapshots/asof-2026-08-23/")]
          print(json.dumps({
              "plaintext_raw": plaintext,
              "encrypted_month_checkpoint_count": len(encrypted_months),
              "encrypted_month_checkpoints": encrypted_months,
              "final_snapshot_file_count": len(snapshot_files),
              "final_snapshot_manifest_present": "snapshots/asof-2026-08-23/manifest.json" in files,
          }, sort_keys=True))
          if plaintext:
              raise SystemExit(f"plaintext raw cache objects present: {plaintext}")
          PY
