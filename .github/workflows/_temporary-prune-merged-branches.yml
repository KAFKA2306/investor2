name: Temporary skfolio artifact compactor

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/_temporary-prune-merged-branches.yml"

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Materialize compact exporter contract
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > src/research/skfolio_plot_exports.py
          printf '%s' '' | base64 -d | gzip -d > tests/test_skfolio_plot_exports.py
          printf '%s' '' | base64 -d | gzip -d > .github/workflows/skfolio-jquants-plots.yml
      - name: Validate compact exporter
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked
          uv run ruff format src/research/skfolio_plot_exports.py tests/test_skfolio_plot_exports.py
          uv run ruff check src/research/skfolio_plot_exports.py tests/test_skfolio_plot_exports.py
          uv run pytest -q tests/test_skfolio_plot_exports.py
      - name: Persist validated contract and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_temporary-prune-merged-branches.yml
          git add src/research/skfolio_plot_exports.py tests/test_skfolio_plot_exports.py .github/workflows/skfolio-jquants-plots.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: compact skfolio plots into one index"
          git push origin HEAD:main
