name: Temporary skfolio exporter compactor

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/_temporary-prune-merged-branches.yml"

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Materialize minimal compact exporter
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > src/research/skfolio_plot_exports.py
          printf '%s' '' | base64 -d | gzip -d > tests/test_skfolio_plot_exports.py
      - name: Validate minimal compact exporter
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked
          uv run ruff format src/research/skfolio_plot_exports.py tests/test_skfolio_plot_exports.py
          uv run ruff check src/research/skfolio_plot_exports.py tests/test_skfolio_plot_exports.py
          uv run pytest -q tests/test_skfolio_plot_exports.py
      - name: Persist validated exporter and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research/skfolio_plot_exports.py tests/test_skfolio_plot_exports.py
          git rm .github/workflows/_temporary-prune-merged-branches.yml
          git diff --cached --check
          git commit -m "chore: compact skfolio plots to two files"
          git push origin HEAD:main
