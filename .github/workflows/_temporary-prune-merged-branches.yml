name: Temporary skfolio artifact compactor retry

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/_temporary-prune-merged-branches.yml"

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Recover compact contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import re
          import subprocess
          from pathlib import Path

          source_commit = "5783db35016bd34805a91264c04c4a164749fabc"
          workflow_path = ".github/workflows/_temporary-prune-merged-branches.yml"
          text = subprocess.check_output(["git", "show", f"{source_commit}:{workflow_path}"], text=True)
          pattern = re.compile(r"printf '%s' '([^']+)' \\| base64 -d \\| gzip -d > ([^\n]+)")
          recovered = set()
          for payload, target_text in pattern.findall(text):
              target = Path(target_text.strip())
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(gzip.decompress(base64.b64decode(payload)))
              recovered.add(target.as_posix())
          expected = {
              "src/research/skfolio_plot_exports.py",
              "tests/test_skfolio_plot_exports.py",
              ".github/workflows/skfolio-jquants-plots.yml",
          }
          if recovered != expected:
              raise SystemExit(f"unexpected recovered files: {sorted(recovered)}")

          plot_workflow = Path(".github/workflows/skfolio-jquants-plots.yml")
          workflow_text = plot_workflow.read_text(encoding="utf-8")
          workflow_text = workflow_text.replace("research/skfolio-jquants-plots", "main")
          if "research/skfolio-jquants-plots" in workflow_text:
              raise SystemExit("stale plot branch reference remains")
          if "main" not in workflow_text:
              raise SystemExit("plot workflow does not target main")
          plot_workflow.write_text(workflow_text, encoding="utf-8")
          PY
      - name: Validate compact exporter
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked
          uv run ruff format src/research/skfolio_plot_exports.py tests/test_skfolio_plot_exports.py
          uv run ruff check --fix src/research/skfolio_plot_exports.py tests/test_skfolio_plot_exports.py
          uv run ruff check src/research/skfolio_plot_exports.py tests/test_skfolio_plot_exports.py
          uv run pytest -q tests/test_skfolio_plot_exports.py
      - name: Persist validated contract and delete temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research/skfolio_plot_exports.py tests/test_skfolio_plot_exports.py .github/workflows/skfolio-jquants-plots.yml
          git rm .github/workflows/_temporary-prune-merged-branches.yml
          git diff --cached --check
          git commit -m "chore: compact skfolio plot artifact contract"
          git push origin HEAD:main
