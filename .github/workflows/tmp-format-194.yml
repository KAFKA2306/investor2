name: One-shot #194 formatter

on:
  push:
    branches: [research/194-schema-port]
    paths:
      - ".github/workflows/tmp-format-194.yml"

permissions:
  contents: write

jobs:
  format-and-remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/194-schema-port
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.5
      - name: Format and remove temporary workflow
        run: |
          set -euo pipefail
          ruff format scripts/alphacrafter_jquants_frontier.py
          rm .github/workflows/tmp-format-194.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/alphacrafter_jquants_frontier.py .github/workflows/tmp-format-194.yml
          git commit -m "style: format AlphaCrafter frontier"
          git push origin HEAD:research/194-schema-port
