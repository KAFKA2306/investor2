name: ARK main materialize once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ark-main-materialize-once.yml

permissions:
  contents: write

concurrency:
  group: ark-big-ideas-evidence
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: unit
        name: Unit contracts
        continue-on-error: true
        run: python -m unittest tests.test_ark_source_health tests.test_ark_cross_theme -v
      - id: health
        name: Verify source health
        continue-on-error: true
        run: python scripts/build_ark_source_health.py --output build/source-health.json
      - id: project
        name: Materialize domain mirrors and projection
        continue-on-error: true
        run: python -m scripts.build_ark_cross_theme --register
      - id: snapshots
        name: Audit persistent snapshots
        continue-on-error: true
        run: python scripts/snapshot_store.py audit
      - id: projection
        name: Audit production projection
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('api/v1/ark-big-ideas/index.json').read_text())
          series = json.loads(Path('api/v1/ark-big-ideas/series.json').read_text())['records']
          matrix = json.loads(Path('api/v1/ark-big-ideas/evidence-matrix.json').read_text())['sources']
          assert index['source_count'] == 16
          assert index['active_feed_count'] == 13
          assert index['metric_row_count'] == len(series)
          assert len(series) > 300
          excluded = {row['logical_repo']: row['projection']['reason'] for row in matrix if row['projection'].get('excluded')}
          assert excluded == {
              'multiomics': 'deferred_by_user',
              'energy-supply': 'deferred_by_user',
              'bitcoin-network': 'blocked_external_evidence',
          }
          print({'rows': len(series), 'excluded': excluded})
          PY
      - name: Commit self-reported result
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
          SNAPSHOTS_OUTCOME: ${{ steps.snapshots.outcome }}
          PROJECTION_OUTCOME: ${{ steps.projection.outcome }}
        run: |
          mkdir -p api/v1/ark-big-ideas
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          checks = {
              'unit': os.environ['UNIT_OUTCOME'],
              'source_health': os.environ['HEALTH_OUTCOME'],
              'materialize': os.environ['PROJECT_OUTCOME'],
              'snapshot_audit': os.environ['SNAPSHOTS_OUTCOME'],
              'projection_audit': os.environ['PROJECTION_OUTCOME'],
          }
          result = {'schema_version': 1, 'success': all(v == 'success' for v in checks.values()), 'checks': checks}
          Path('api/v1/ark-big-ideas/materialization-status.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(result)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/v1/ark-big-ideas/materialization-status.json
          if grep -q '"success": true' api/v1/ark-big-ideas/materialization-status.json; then
            cp build/source-health.json api/v1/ark-big-ideas/source-health.json
            git add api/v1/ark-big-ideas data/ark-big-ideas/snapshots data/input_ledger/snapshot_catalog.ndjson
          fi
          git commit -m 'data: report ARK materialization result'
          git push
