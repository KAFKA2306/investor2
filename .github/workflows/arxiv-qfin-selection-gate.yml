name: Build arXiv q-fin selection manifest

on:
  pull_request:
    paths:
      - "scripts/select_arxiv_qfin_papers.py"
      - "scripts/select_arxiv_qfin_year.py"
      - "tests/test_arxiv_qfin_selection.py"
      - "docs/research/catalogs/arxiv_qfin_selector_rules_v1.json"
      - "docs/research/catalogs/arxiv_qfin_*_selection_manifest.json"
      - "docs/specs/arxiv_qfin_selection_gate.md"
      - ".github/workflows/arxiv-qfin-selection-gate.yml"
  push:
    branches:
      - main
      - "data/arxiv-finance-metadata-*"
    paths:
      - "scripts/select_arxiv_qfin_papers.py"
      - "scripts/select_arxiv_qfin_year.py"
      - "tests/test_arxiv_qfin_selection.py"
      - "docs/research/catalogs/arxiv_qfin_selector_rules_v1.json"
      - "docs/specs/arxiv_qfin_selection_gate.md"
      - ".github/workflows/arxiv-qfin-selection-gate.yml"
  workflow_dispatch:
    inputs:
      year:
        description: "Frozen q-fin population year to select"
        required: true
        default: "2021"
        type: string

permissions:
  contents: write

concurrency:
  group: arxiv-qfin-selection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    env:
      INPUT_YEAR: ${{ github.event.inputs.year || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve selection year
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ -n "$INPUT_YEAR" ]]; then
            year="$INPUT_YEAR"
          elif [[ "$branch" =~ ^data/arxiv-finance-metadata-([0-9]{4})$ ]]; then
            year="${BASH_REMATCH[1]}"
          else
            year="2021"
          fi
          if [[ ! "$year" =~ ^[0-9]{4}$ ]]; then
            echo "Invalid q-fin population year: $year" >&2
            exit 1
          fi
          echo "YEAR=$year" >> "$GITHUB_ENV"
          echo "SELECTION_PATH=docs/research/catalogs/arxiv_qfin_${year}_selection_manifest.json" >> "$GITHUB_ENV"

      - name: Selector regression contracts
        run: python tests/test_arxiv_qfin_selection.py

      - name: Existing arXiv parser contract
        run: python tests/test_fetch_arxiv_finance_metadata.py

      - name: Build canonical selection manifest
        shell: bash
        run: |
          if [[ "$YEAR" == "2021" ]]; then
            python scripts/select_arxiv_qfin_papers.py \
              --reuse-key arxiv/q-fin/2021/metadata \
              --rules docs/research/catalogs/arxiv_qfin_selector_rules_v1.json \
              --output "$SELECTION_PATH"
          else
            python scripts/select_arxiv_qfin_year.py \
              --year "$YEAR" \
              --rules docs/research/catalogs/arxiv_qfin_selector_rules_v1.json \
              --output "$SELECTION_PATH"
          fi

      - name: Full-universe byte stability
        shell: bash
        run: |
          cp "$SELECTION_PATH" /tmp/selection-first.json
          if [[ "$YEAR" == "2021" ]]; then
            python scripts/select_arxiv_qfin_papers.py \
              --reuse-key arxiv/q-fin/2021/metadata \
              --rules docs/research/catalogs/arxiv_qfin_selector_rules_v1.json \
              --output "$SELECTION_PATH"
          else
            python scripts/select_arxiv_qfin_year.py \
              --year "$YEAR" \
              --rules docs/research/catalogs/arxiv_qfin_selector_rules_v1.json \
              --output "$SELECTION_PATH"
          fi
          cmp /tmp/selection-first.json "$SELECTION_PATH"

      - name: Canonical population and provenance contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          year = int(os.environ["YEAR"])
          expected = {
              2019: {
                  "sha": "7d7fcb2639219c5a2e528ac63347e2d18b73fa46ed8637e4832322dd9c8b90cb",
                  "count": 1059,
              },
              2021: {
                  "sha": "a1ebbbd25ae65b5bce391ccb8ded1a27fa7c013102581251cc1f6ee4e73a948c",
                  "count": 1132,
              },
          }
          if year not in expected:
              raise SystemExit(f"No frozen provenance fixture for {year}; add it before promotion")
          manifest = json.loads(Path(os.environ["SELECTION_PATH"]).read_text(encoding="utf-8"))
          fixture = expected[year]
          source = manifest["source_snapshot"]
          summary = manifest["summary"]
          assert source["reuse_key"] == f"arxiv/q-fin/{year}/metadata"
          assert source["artifact_sha256"] == fixture["sha"]
          assert source["record_count"] == fixture["count"]
          assert summary["record_count"] == fixture["count"]
          assert sum(summary["decision_counts"].values()) == fixture["count"]
          assert len(manifest["candidates"]) == fixture["count"]
          assert all(row["source_snapshot_sha256"] == fixture["sha"] for row in manifest["candidates"])
          assert all(row["research_importance"] == "UNASSESSED" for row in manifest["candidates"])
          expected_lookahead = f"CURRENT_ARXIV_METADATA_NOT_{year}_VINTAGE"
          assert all(row["lookahead_risk"] == expected_lookahead for row in manifest["candidates"])
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: 2019 sentinel selection contract
        if: env.YEAR == '2019'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["SELECTION_PATH"]).read_text(encoding="utf-8"))
          rows = {row["arxiv_id"]: row for row in manifest["candidates"]}
          for arxiv_id in ("1904.04912", "1911.10107"):
              row = rows[arxiv_id]
              assert row["decision"] == "SELECT", (arxiv_id, row["decision"], row["reason_codes"])
              assert row["reason_codes"]
              assert row["input_output_metric_identifiability"] == "PAPER_TEXT_NOT_INSPECTED"
              assert row["sample_split_protocol_extractability"] == "PAPER_TEXT_NOT_INSPECTED"
              assert row["data_access_status"] == "PAPER_TEXT_NOT_INSPECTED"
              print(json.dumps({
                  "arxiv_id": arxiv_id,
                  "decision": row["decision"],
                  "priority_score": row["priority_score"],
                  "reason_codes": row["reason_codes"],
                  "evidence": row["evidence"],
              }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Inspect top selection queue
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["SELECTION_PATH"]).read_text(encoding="utf-8"))
          selected = [row for row in manifest["candidates"] if row["decision"] == "SELECT"][:20]
          for rank, row in enumerate(selected, 1):
              print(json.dumps({
                  "rank": rank,
                  "arxiv_id": row["arxiv_id"],
                  "title": row["title"],
                  "primary_category": row["primary_category"],
                  "priority_score": row["priority_score"],
                  "evidence": row["evidence"],
              }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Snapshot ledger audit
        run: python scripts/snapshot_store.py audit

      - name: Pull request must commit canonical manifest
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- "$SELECTION_PATH"

      - name: Commit canonical manifest to current branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$SELECTION_PATH"
          if git diff --cached --quiet; then
            echo "No selection manifest changes to commit."
          else
            git commit -m "Build ${YEAR} q-fin selection manifest"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
