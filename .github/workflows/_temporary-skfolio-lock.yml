name: Temporary skfolio lock refresh

on:
  push:
    branches:
      - research/skfolio-characteristics-v1

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/skfolio-characteristics-v1
      - uses: astral-sh/setup-uv@v6
      - name: Resolve locked dependencies
        run: uv lock
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: refresh uv lock for skfolio"
          git push
