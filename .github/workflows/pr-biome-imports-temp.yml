name: Temporary Biome import fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"
      - run: |
          bun ci
          bun x biome check --write --config-path=config/biome.json \
            src/dashboard/server.ts src/tasks/stats.ts \
            src/shared/cache_statistics.ts tests/dashboard_stats_contract.test.ts
      - name: Commit canonical imports
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/server.ts src/tasks/stats.ts src/shared/cache_statistics.ts tests/dashboard_stats_contract.test.ts
          git commit -m "style: apply canonical Biome imports"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
