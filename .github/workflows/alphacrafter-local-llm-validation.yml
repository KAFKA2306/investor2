name: AlphaCrafter local LLM validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [research/alphacrafter-official-reproduction]

permissions:
  contents: read

jobs:
  local-ollama-responses-and-alphacrafter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_VERSION: "0.32.14"
      LOCAL_MODEL: "qwen3:0.6b"
      OLLAMA_CONTEXT_LENGTH: "32768"
      OLLAMA_NO_CLOUD: "1"
      OPENAI_API_URL: "http://127.0.0.1:11434/v1"
      OPENAI_API_KEY: "ollama"
    steps:
      - name: Checkout investor2
        uses: actions/checkout@v4

      - name: Checkout pinned official AlphaCrafter
        uses: actions/checkout@v4
        with:
          repository: NJU-LINK/AlphaCrafter
          ref: c6dbc1ba4e0a4ecbc3ea1454c5290dbea4b36b0d
          path: upstream

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python runtime and official AlphaCrafter package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install openai python-dotenv pydantic requests pyyaml pandas numpy scikit-learn matplotlib seaborn tqdm lightgbm
          python -m pip install -e upstream

      - name: Install pinned Ollama
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/install.sh" -o /tmp/ollama-install.sh
          echo "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f  /tmp/ollama-install.sh" | sha256sum -c -
          OLLAMA_VERSION="${OLLAMA_VERSION}" sh /tmp/ollama-install.sh
          ollama --version

      - name: Replace installer service with verified local-only Ollama process
        run: |
          set -euo pipefail
          sudo systemctl stop ollama || true
          sleep 1
          if curl -fsS http://127.0.0.1:11434/api/version >/dev/null 2>&1; then
            echo "installer-managed Ollama still owns localhost:11434" >&2
            exit 1
          fi
          nohup env OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH}" OLLAMA_NO_CLOUD="${OLLAMA_NO_CLOUD}" OLLAMA_HOST=127.0.0.1:11434 ollama serve >/tmp/ollama-server.log 2>&1 &
          echo $! >/tmp/ollama.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version >/tmp/ollama-version.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/ollama-version.json
          server_pid="$(cat /tmp/ollama.pid)"
          tr '\0' '\n' < "/proc/${server_pid}/environ" | grep -E '^OLLAMA_(CONTEXT_LENGTH|NO_CLOUD|HOST)=' | sort | tee /tmp/ollama-server-env.txt
          grep -Fx 'OLLAMA_CONTEXT_LENGTH=32768' /tmp/ollama-server-env.txt
          grep -Fx 'OLLAMA_NO_CLOUD=1' /tmp/ollama-server-env.txt
          grep -Fx 'OLLAMA_HOST=127.0.0.1:11434' /tmp/ollama-server-env.txt
          cat /tmp/ollama-version.json
          ollama pull "${LOCAL_MODEL}"
          ollama list

      - name: Measure Responses API, tool schema, and round trip on localhost
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from openai import OpenAI

          client = OpenAI(base_url='http://127.0.0.1:11434/v1', api_key='ollama', timeout=300)
          model = 'qwen3:0.6b'
          plain = client.responses.create(model=model, input='Reply with exactly LOCAL_OK and nothing else.', max_output_tokens=256)
          tools = [{
              'type': 'function',
              'name': 'record_probe',
              'description': 'Record a validation probe value.',
              'parameters': {
                  'type': 'object',
                  'properties': {'value': {'type': 'string'}},
                  'required': ['value'],
                  'additionalProperties': False,
              },
          }]
          first = client.responses.create(
              model=model,
              instructions='You must call record_probe. Do not answer directly.',
              input=[{'role': 'user', 'content': 'Call record_probe with value LOCAL_TOOL_OK.'}],
              tools=tools,
              max_output_tokens=256,
          )
          calls = [x for x in first.output if getattr(x, 'type', None) == 'function_call']
          tool_call_present = bool(calls)
          tool_schema_exact = False
          tool_name = None
          tool_arguments = None
          roundtrip_completed = False
          roundtrip_text_nonempty = False
          second_output_types = []
          if calls:
              call = calls[0]
              tool_name = call.name
              try:
                  tool_arguments = json.loads(call.arguments)
              except Exception:
                  tool_arguments = {'_raw': call.arguments}
              tool_schema_exact = tool_name == 'record_probe' and tool_arguments == {'value': 'LOCAL_TOOL_OK'}
              continuation = list(first.output)
              continuation.append({
                  'type': 'function_call_output',
                  'call_id': call.call_id,
                  'output': json.dumps({'record_probe': 'accepted'}),
              })
              second = client.responses.create(
                  model=model,
                  instructions='The tool result is authoritative. Reply with exactly ROUNDTRIP_OK.',
                  input=continuation,
                  tools=tools,
                  max_output_tokens=256,
              )
              roundtrip_completed = True
              roundtrip_text_nonempty = bool(second.output_text)
              second_output_types = [getattr(x, 'type', None) for x in second.output]
          evidence = {
              'schema_version': 'investor2.alphacrafter.local-llm-transport.v4',
              'endpoint': 'http://127.0.0.1:11434/v1',
              'external_llm_api_used': False,
              'model': model,
              'responses_api_request_completed': True,
              'plain_output_text_nonempty': bool(plain.output_text),
              'function_call_present': tool_call_present,
              'function_call_schema_exact': tool_schema_exact,
              'function_call_name': tool_name,
              'function_call_arguments': tool_arguments,
              'function_call_output_request_completed': roundtrip_completed,
              'roundtrip_output_text_nonempty': roundtrip_text_nonempty,
              'first_output_types': [getattr(x, 'type', None) for x in first.output],
              'second_output_types': second_output_types,
              'frontier_evidence': False,
              'interpretation': 'LOCAL_RESPONSES_TRANSPORT_WORKS_MODEL_TOOL_QUALITY_MEASURED',
          }
          Path('/tmp/alphacrafter-local-transport.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PY
          ollama ps | tee /tmp/ollama-ps.txt
          python - <<'PY'
          import re
          from pathlib import Path
          lines = Path('/tmp/ollama-ps.txt').read_text().splitlines()
          if len(lines) < 2:
              raise SystemExit('ollama ps did not report a loaded model')
          match = re.search(r'\b(?:\d+%\s+CPU|CPU)\s+(\d+)\b', lines[1])
          if not match:
              raise SystemExit(f'could not parse runtime context from: {lines[1]!r}')
          context = int(match.group(1))
          Path('/tmp/ollama-runtime-context.txt').write_text(f'{context}\n')
          if context < 32768:
              raise SystemExit(f'runtime context too small: {context}')
          print(f'runtime_context={context}')
          PY

      - name: Configure official AlphaCrafter session for local model only
        run: |
          set -euo pipefail
          cd upstream/alphacrafter
          rm -rf sandbox/local-qwen3-validation
          cp -a sandbox/template_a sandbox/local-qwen3-validation
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          model = 'qwen3:0.6b'
          models_path = Path('sandbox/local-qwen3-validation/config/models.json')
          models = json.loads(models_path.read_text())
          models[model] = {
              'producer': 'OpenAI',
              'inputs': ['text'],
              'cost': {'input': 0, 'output': 0},
              'input_token_limit': 32768,
              'output_token_limit': 4096,
          }
          models_path.write_text(json.dumps(models, indent=4) + '\n')
          cfg = yaml.safe_load(Path('config.yaml').read_text())
          for role in ('miner', 'screener', 'trader'):
              cfg[role]['model']['code'] = model
          # CI smoke budget only; official role instructions and tool schemas are unchanged.
          cfg['miner']['count'] = 1
          cfg['miner']['ids'] = ['miner_1']
          cfg['miner']['max_iterations'] = 1
          cfg['screener']['max_iterations'] = 1
          cfg['trader']['max_iterations'] = 1
          cfg['workflow']['max_cycles'] = 1
          Path('config-local-qwen3.yaml').write_text(yaml.safe_dump(cfg, sort_keys=False))
          PY

      - name: Execute official AlphaCrafter against localhost Ollama
        run: |
          set -euo pipefail
          cd upstream/alphacrafter
          set +e
          timeout 300 python main.py local-qwen3-validation --config config-local-qwen3.yaml > /tmp/alphacrafter-local-run.log 2>&1
          exit_code=$?
          set -e
          cat /tmp/alphacrafter-local-run.log
          export EXIT_CODE="$exit_code"
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          log = Path('/tmp/alphacrafter-local-run.log').read_text(errors='replace')
          ollama_log = Path('/tmp/ollama-server.log').read_text(errors='replace')
          required = [
              'Agent initialized with model: qwen3:0.6b',
              'STARTING NEW WORKFLOW',
              'MINER_MINER_1 PHASE',
              'SCREENER PHASE',
              'TRADER PHASE',
              'WORKFLOW COMPLETED',
          ]
          missing = [marker for marker in required if marker not in log]
          if missing:
              raise SystemExit(f'Official AlphaCrafter did not reach required local-agent markers: {missing}')
          if any(marker in log for marker in ('api.openai.com', 'AuthenticationError', 'invalid_api_key')):
              raise SystemExit('External OpenAI path unexpectedly appeared in local execution log')
          if 'truncating input prompt' in ollama_log:
              raise SystemExit('Ollama truncated the AlphaCrafter prompt')
          runtime_context = int(Path('/tmp/ollama-runtime-context.txt').read_text().strip())
          transport = json.loads(Path('/tmp/alphacrafter-local-transport.json').read_text())
          tool_counts = [int(x) for x in re.findall(r'Total tool calls: (\d+)', log)]
          semantic_grounding_pass = any(x > 0 for x in tool_counts)
          evidence = {
              'schema_version': 'investor2.alphacrafter.local-offline-smoke.v4',
              'upstream_repository': 'NJU-LINK/AlphaCrafter',
              'upstream_commit': 'c6dbc1ba4e0a4ecbc3ea1454c5290dbea4b36b0d',
              'model': 'qwen3:0.6b',
              'endpoint': 'http://127.0.0.1:11434/v1',
              'external_llm_api_used': False,
              'ollama_no_cloud_env_verified': True,
              'requested_context_length': 32768,
              'runtime_reported_context_length': runtime_context,
              'prompt_truncation_observed': False,
              'responses_transport_pass': transport['responses_api_request_completed'],
              'direct_tool_call_present': transport['function_call_present'],
              'direct_tool_schema_exact': transport['function_call_schema_exact'],
              'direct_tool_roundtrip_completed': transport['function_call_output_request_completed'],
              'official_workflow_completed': True,
              'api_request_count': log.count('API Request'),
              'api_response_count': log.count('API Response'),
              'tool_call_counts_by_agent_run': tool_counts,
              'semantic_grounding_pass': semantic_grounding_pass,
              'semantic_quality_interpretation': 'PASS_TOOL_USE_OBSERVED' if semantic_grounding_pass else 'FAIL_NO_TOOL_USE_OUTPUT_IS_UNGROUNDED',
              'process_exit_code': int(os.environ['EXIT_CODE']),
              'performance_evidence': False,
              'reproduction_state': 'LOCAL_TRANSPORT_VERIFIED_NOT_PERFORMANCE_REPRODUCTION',
          }
          Path('/tmp/alphacrafter-local-offline-smoke.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PY

      - name: Upload local-LLM validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphacrafter-local-llm-validation
          path: |
            /tmp/ollama-version.json
            /tmp/ollama-server-env.txt
            /tmp/ollama-runtime-context.txt
            /tmp/ollama-ps.txt
            /tmp/ollama-server.log
            /tmp/alphacrafter-local-transport.json
            /tmp/alphacrafter-local-run.log
            /tmp/alphacrafter-local-offline-smoke.json
          if-no-files-found: error
