name: Verify deployed GitHub Pages

on:
  workflow_run:
    workflows:
      - Validate and deploy AAARTS evidence dashboard
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  verify-production:
    name: Verify production artifact
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve expected deployed revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${WORKFLOW_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Inspect GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p production-validation
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            | tee production-validation/pages-configuration.json

      - name: Poll production until the expected revision is visible
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          base="https://kafka2306.github.io/investor2"
          mkdir -p production-validation
          success=0
          for attempt in $(seq 1 20); do
            cache_bust="${EXPECTED_REVISION}-${attempt}"
            if curl --fail --silent --show-error --location \
                "$base/?smoke=$cache_bust" \
                -o production-validation/index.html \
              && curl --fail --silent --show-error --location \
                "$base/data/research_public_manifest.json?smoke=$cache_bust" \
                -o production-validation/research-public-manifest.json \
              && curl --fail --silent --show-error --location \
                "$base/data/research_2019_public_manifest.json?smoke=$cache_bust" \
                -o production-validation/research-2019-public-manifest.json \
              && python - <<'PY'
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path

          module_path = Path("scripts/build_public_research_manifest.py")
          spec = importlib.util.spec_from_file_location("public_manifest_production_validator", module_path)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          expected = os.environ["EXPECTED_REVISION"]
          public = json.loads(Path("production-validation/research-public-manifest.json").read_text(encoding="utf-8"))
          public_2019 = json.loads(Path("production-validation/research-2019-public-manifest.json").read_text(encoding="utf-8"))
          module.validate_public_manifest(public, expected_revision=expected)
          module.validate_public_2019_manifest(public_2019, expected_revision=expected)
          html = Path("production-validation/index.html").read_text(encoding="utf-8")
          for required in ("research_public_manifest.json", "research_2019_public_manifest.json"):
              if required not in html:
                  raise ValueError(f"production HTML does not reference {required}")
          PY
            then
              success=1
              break
            fi
            echo "attempt ${attempt}/20: deployed revision is not visible yet" | tee -a production-validation/poll.log
            sleep 6
          done
          if [ "$success" -ne 1 ]; then
            echo "production did not expose expected revision ${EXPECTED_REVISION} within 120 seconds" >&2
            exit 1
          fi

      - name: Upload production validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-production-validation-${{ steps.revision.outputs.sha }}
          path: production-validation
          if-no-files-found: error
          retention-days: 30
