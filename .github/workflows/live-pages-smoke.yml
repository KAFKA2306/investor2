name: Verify deployed GitHub Pages

on:
  workflow_run:
    workflows:
      - Build and deploy modular evidence browser
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  verify-production:
    name: Verify production artifact
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve expected deployed revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${WORKFLOW_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p production-validation
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            | tee production-validation/pages-configuration.json

      - name: Poll production until the expected revision is visible
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          base="https://kafka2306.github.io/investor2"
          mkdir -p production-validation
          success=0
          for attempt in $(seq 1 20); do
            cache_bust="${EXPECTED_REVISION}-${attempt}"
            if curl --fail --silent --show-error --location \
                "$base/?smoke=$cache_bust" \
                -o production-validation/index.html \
              && curl --fail --silent --show-error --location \
                "$base/manifest.json?smoke=$cache_bust" \
                -o production-validation/manifest.json \
              && curl --fail --silent --show-error --location \
                "$base/revision.json?smoke=$cache_bust" \
                -o production-validation/revision.json \
              && curl --fail --silent --show-error --location \
                "$base/app.js?smoke=$cache_bust" \
                -o production-validation/app.js \
              && curl --fail --silent --show-error --location \
                "$base/styles.css?smoke=$cache_bust" \
                -o production-validation/styles.css \
              && python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["EXPECTED_REVISION"]
          manifest = json.loads(Path("production-validation/manifest.json").read_text(encoding="utf-8"))
          revision = json.loads(Path("production-validation/revision.json").read_text(encoding="utf-8"))
          html = Path("production-validation/index.html").read_text(encoding="utf-8")
          app = Path("production-validation/app.js").read_text(encoding="utf-8")
          assert manifest["revision"] == expected
          assert revision["revision"] == expected
          assert revision["artifact_count"] == len(manifest["artifacts"])
          assert manifest["content_roots"] == ["docs", "data", "generated", "api"]
          assert "investor2 Evidence Browser" in html
          assert "manifest.json" in app
          local = next(item["local_url"] for item in manifest["artifacts"] if item["local_url"])
          Path("production-validation/first-local-url.txt").write_text(local + "\n", encoding="utf-8")
          PY
            then
              first_local_url="$(cat production-validation/first-local-url.txt)"
              if curl --fail --silent --show-error --location \
                  "$base/${first_local_url}?smoke=$cache_bust" \
                  -o production-validation/first-artifact; then
                success=1
                break
              fi
            fi
            echo "attempt ${attempt}/20: deployed revision is not visible yet" | tee -a production-validation/poll.log
            sleep 6
          done
          if [ "$success" -ne 1 ]; then
            echo "production did not expose expected revision ${EXPECTED_REVISION} within 120 seconds" >&2
            exit 1
          fi

      - name: Upload production validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-production-validation-${{ steps.revision.outputs.sha }}
          path: production-validation
          if-no-files-found: error
          retention-days: 30
