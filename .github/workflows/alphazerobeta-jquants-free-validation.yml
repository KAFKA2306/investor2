name: AlphaZeroBeta J-Quants Free Japan validation

on:
  push:
    branches:
      - research/alphazerobeta-jquants-free-validation
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alphazerobeta-jquants-free-validation-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install contract dependencies
        run: python -m pip install ruff
      - name: Verify changed Python entry points
        run: |
          ruff format --check \
            scripts/alphazerobeta_jquants_free_collect.py \
            scripts/alphazerobeta_jquants_cache_materialize.py \
            scripts/alphazerobeta_jquants_pit_master.py \
            scripts/alphazerobeta_japan_free_prepare.py \
            scripts/alphazerobeta_japan_free_train.py
          ruff check \
            scripts/alphazerobeta_jquants_free_collect.py \
            scripts/alphazerobeta_jquants_cache_materialize.py \
            scripts/alphazerobeta_jquants_pit_master.py \
            scripts/alphazerobeta_japan_free_prepare.py \
            scripts/alphazerobeta_japan_free_train.py
          python -m py_compile \
            scripts/alphazerobeta_jquants_free_collect.py \
            scripts/alphazerobeta_jquants_cache_materialize.py \
            scripts/alphazerobeta_jquants_pit_master.py \
            scripts/alphazerobeta_japan_free_prepare.py \
            scripts/alphazerobeta_japan_free_train.py

  snapshot-and-validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'push' && github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[snapshot]'))
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: k4fka/investor2-jquants-free-cache
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/alphazerobeta-jquants-free-validation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require credentials
        run: |
          test -n "$JQUANTS_API_KEY"
          test -n "$HF_TOKEN"
      - name: Install execution dependencies
        run: |
          python -m pip install jquants-api-client huggingface-hub cryptography numpy pandas pyarrow pydantic
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Acquire complete visible Free equity window into encrypted private cache
        run: |
          rm -rf /tmp/jquants-free /tmp/hf-jquants /tmp/jquants-materialized /tmp/alphazerobeta-japan
          python scripts/alphazerobeta_jquants_free_collect.py \
            --output-dir /tmp/jquants-free \
            --hf-repo-id "$HF_REPO_ID" \
            --request-interval 15
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/jquants-free/manifest.json').read_text())
          Path('/tmp/snapshot_id').write_text(manifest['snapshot_id'])
          print(json.dumps({
              'snapshot_id': manifest['snapshot_id'],
              'actual_date_range': manifest['actual_date_range'],
              'ticker_count': manifest['ticker_count'],
              'price_rows': manifest['price_rows'],
              'request_count_current_run': manifest['request_count_current_run'],
              'resumed_months': manifest['resumed_months'],
              'fetched_months': manifest['fetched_months'],
              'hf_plaintext_raw_data': manifest['encryption']['plaintext_raw_data_on_hf'],
          }, sort_keys=True))
          PY
      - name: Delete acquisition copy and materialize only from encrypted Hugging Face cache
        run: |
          SNAPSHOT_ID="$(cat /tmp/snapshot_id)"
          rm -rf /tmp/jquants-free
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_id = open('/tmp/snapshot_id').read().strip()
          snapshot_download(
              repo_id=os.environ['HF_REPO_ID'],
              repo_type='dataset',
              token=os.environ['HF_TOKEN'],
              local_dir='/tmp/hf-jquants',
              allow_patterns=[f'snapshots/{snapshot_id}/**'],
          )
          PY
          python scripts/alphazerobeta_jquants_cache_materialize.py \
            --source-dir "/tmp/hf-jquants/snapshots/$SNAPSHOT_ID" \
            --output-dir /tmp/jquants-materialized
          test -f /tmp/jquants-materialized/manifest.json
          test -f /tmp/jquants-materialized/benchmark.parquet
      - name: Resolve bounded validation dates and PIT master date
        run: |
          ROOT=/tmp/jquants-materialized
          ROOT="$ROOT" python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path
          import pandas as pd
          root = Path(os.environ['ROOT'])
          manifest = json.loads((root / 'manifest.json').read_text())
          actual_end = pd.Timestamp(manifest['actual_date_range']['end'])
          test_end = actual_end
          test_start = test_end - pd.DateOffset(months=6) + pd.Timedelta(days=1)
          universe_cutoff = test_start - pd.DateOffset(months=3)
          benchmark = pd.read_parquet(root / 'benchmark.parquet')
          benchmark_dates = pd.to_datetime(benchmark['Date'], errors='raise').dt.tz_localize(None)
          eligible = benchmark_dates[benchmark_dates <= universe_cutoff]
          if eligible.empty:
              raise SystemExit('no benchmark date on/before universe cutoff')
          universe_master_date = eligible.max()
          print(f"SNAPSHOT_ROOT={root}")
          print(f"TEST_START={test_start.date()}")
          print(f"TEST_END={test_end.date()}")
          print(f"UNIVERSE_CUTOFF={universe_cutoff.date()}")
          print(f"UNIVERSE_MASTER_DATE={universe_master_date.date()}")
          PY
      - name: Materialize cutoff-date J-Quants master from encrypted HF cache
        run: |
          SNAPSHOT_ID="$(cat /tmp/snapshot_id)"
          python scripts/alphazerobeta_jquants_pit_master.py \
            --date "$UNIVERSE_MASTER_DATE" \
            --hf-repo-id "$HF_REPO_ID" \
            --snapshot-id "$SNAPSHOT_ID" \
            --output "$SNAPSHOT_ROOT/universe.parquet"
      - name: Prepare PIT common-stock top-64 panel from materialized cache
        run: |
          mkdir -p /tmp/alphazerobeta-japan
          python scripts/alphazerobeta_japan_free_prepare.py \
            --market-snapshot-dir "$SNAPSHOT_ROOT" \
            --market-regions jp \
            --output /tmp/alphazerobeta-japan/panel.npz \
            --max-assets 64 \
            --universe-cutoff "$UNIVERSE_CUTOFF"
      - name: Execute two OOS folds and matched correlation-penalty ablation
        shell: bash
        run: |
          set -euo pipefail
          for fold in 0 1; do
            seed=$((2306 + fold))
            python scripts/alphazerobeta_japan_free_train.py \
              --dataset /tmp/alphazerobeta-japan/panel.npz \
              --output "/tmp/alphazerobeta-japan/primary-fold${fold}.json" \
              --test-start "$TEST_START" --test-end "$TEST_END" --fold-index "$fold" \
              --device cpu --seed "$seed" --iterations 10 --horizon 200 \
              --hidden-size 512 --agent-window 100 \
              --transaction-cost-bps 15 --borrow-fee-bps 30 \
              --lambda-corr 0.5 --lambda-turnover 0.001 --reward-semantics paper
            python scripts/alphazerobeta_japan_free_train.py \
              --dataset /tmp/alphazerobeta-japan/panel.npz \
              --output "/tmp/alphazerobeta-japan/ablation-fold${fold}.json" \
              --test-start "$TEST_START" --test-end "$TEST_END" --fold-index "$fold" \
              --device cpu --seed "$seed" --iterations 10 --horizon 200 \
              --hidden-size 512 --agent-window 100 \
              --transaction-cost-bps 15 --borrow-fee-bps 30 \
              --lambda-corr 0 --lambda-turnover 0.001 --reward-semantics paper
          done
      - name: Compare OOS evidence
        run: |
          python scripts/alphazerobeta_compare.py \
            --dataset /tmp/alphazerobeta-japan/panel.npz \
            --primary-weights /tmp/alphazerobeta-japan/primary-fold0.weights.npz /tmp/alphazerobeta-japan/primary-fold1.weights.npz \
            --ablation-weights /tmp/alphazerobeta-japan/ablation-fold0.weights.npz /tmp/alphazerobeta-japan/ablation-fold1.weights.npz \
            --output /tmp/alphazerobeta-japan/comparison.json \
            --transaction-cost-bps 15 --borrow-fee-bps 30
      - name: Persist derived evidence only
        shell: bash
        run: |
          set -euo pipefail
          target=docs/research/results/alphazerobeta_jquants_free
          rm -rf "$target"
          mkdir -p "$target"
          cp "$SNAPSHOT_ROOT/manifest.json" "$target/source-manifest.json"
          cp /tmp/alphazerobeta-japan/panel.npz.manifest.json "$target/dataset-manifest.json"
          cp /tmp/alphazerobeta-japan/primary-fold*.json "$target/"
          cp /tmp/alphazerobeta-japan/ablation-fold*.json "$target/"
          cp /tmp/alphazerobeta-japan/comparison.json "$target/"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('docs/research/results/alphazerobeta_jquants_free')
          source = json.loads((root / 'source-manifest.json').read_text())
          dataset = json.loads((root / 'dataset-manifest.json').read_text())
          comparison = json.loads((root / 'comparison.json').read_text())
          payload = {
              'schema_version': 'investor2.alphazerobeta-jquants-free-validation.v4',
              'execution_status': 'completed',
              'source': {
                  'source': source['source'],
                  'plan': source['plan'],
                  'actual_date_range': source['actual_date_range'],
                  'ticker_count': source['ticker_count'],
                  'price_rows': source['price_rows'],
                  'observed_market_days': source['observed_market_days'],
                  'hf_repo_id': source['hf_repo_id'],
                  'hf_path': source['hf_path'],
                  'visibility': 'private',
                  'encrypted_at_rest': True,
                  'plaintext_raw_data_on_hf': source['encryption']['plaintext_raw_data_on_hf'],
              },
              'universe_contract': {
                  'master_dates': dataset.get('universe_master_dates'),
                  'filter': dataset.get('universe_filter'),
                  'master_rows': dataset.get('universe_master_rows'),
                  'allowed_common_stock_codes': dataset.get('allowed_common_stock_codes'),
                  'universe_cutoff': dataset['universe_cutoff'],
              },
              'trained_asset_count': len(dataset['selected_codes']),
              'selected_codes': dataset['selected_codes'],
              'walk_forward': {'train_months': 12, 'validation_months': 3, 'test_months': 3, 'folds': 2},
              'primary_lambda_corr_0_5': comparison['primary_lambda_corr_0_5'],
              'ablation_lambda_corr_0': comparison['ablation_lambda_corr_0'],
              'gates': comparison['gates'],
              'verdict': comparison['verdict'],
              'benchmark': '13060 NEXT FUNDS TOPIX ETF proxy; not exact TOPIX and excluded from the investable universe',
              'claim_boundary': 'J-Quants Free Japanese common-stock surrogate with paper model/reward semantics; not the licensed-data paper experiment.',
          }
          (root / 'summary.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m "research: persist J-Quants Free AlphaZeroBeta evidence [evidence]"
            git push origin HEAD:research/alphazerobeta-jquants-free-validation
          fi
          rm -rf /tmp/jquants-materialized /tmp/hf-jquants /tmp/alphazerobeta-japan
