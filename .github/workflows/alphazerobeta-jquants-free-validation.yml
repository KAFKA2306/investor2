name: AlphaZeroBeta J-Quants Free validation (retired)

on:
  push:
    branches:
      - feat/alphazerobeta-hf-market-cache
    paths:
      - .github/workflows/alphazerobeta-jquants-free-validation.yml

permissions:
  contents: read

concurrency:
  group: alphazerobeta-jquants-free-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Raw J-Quants publication to Hugging Face is disabled; use the repository's canonical license-gated J-Quants pipeline."
