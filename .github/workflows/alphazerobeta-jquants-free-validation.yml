name: AlphaZeroBeta J-Quants Free Japan validation

on:
  push:
    branches:
      - research/alphazerobeta-jquants-free-validation
    paths:
      - scripts/alphazerobeta_jquants_free_collect.py
      - scripts/alphazerobeta_japan_free_train.py
      - .github/workflows/alphazerobeta-jquants-free-validation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alphazerobeta-jquants-free-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/alphazerobeta-jquants-free-validation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require J-Quants credential
        run: test -n "$JQUANTS_API_KEY"
      - name: Install focused dependencies
        run: |
          python -m pip install jquants-api-client numpy pandas pyarrow pydantic ruff
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify code contract
        run: |
          ruff format --check scripts/alphazerobeta_jquants_free_collect.py scripts/alphazerobeta_japan_free_train.py
          ruff check scripts/alphazerobeta_jquants_free_collect.py scripts/alphazerobeta_japan_free_train.py
          python -m py_compile scripts/alphazerobeta_jquants_free_collect.py scripts/alphazerobeta_japan_free_train.py
      - name: Resolve current Free-plan visible window
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import UTC, datetime, timedelta
          import pandas as pd

          today = pd.Timestamp(datetime.now(tz=UTC).date())
          source_start = today - pd.DateOffset(years=2)
          source_end = today - timedelta(days=84)
          test_end = source_end + pd.offsets.MonthEnd(0)
          test_start = (test_end + pd.Timedelta(days=1)) - pd.DateOffset(months=6)
          universe_cutoff = test_start - pd.DateOffset(months=10)
          print(f"SOURCE_START={source_start.date()}")
          print(f"SOURCE_END={source_end.date()}")
          print(f"TEST_START={test_start.date()}")
          print(f"TEST_END={test_end.date()}")
          print(f"UNIVERSE_CUTOFF={universe_cutoff.date()}")
          PY
      - name: Collect all visible Free-plan Japan data ephemerally
        run: |
          rm -rf /tmp/jquants-free /tmp/alphazerobeta-japan
          python scripts/alphazerobeta_jquants_free_collect.py \
            --output-dir /tmp/jquants-free \
            --start "$SOURCE_START" \
            --end "$SOURCE_END"
      - name: Prepare PIT-safe top-64 liquid panel
        run: |
          mkdir -p /tmp/alphazerobeta-japan
          python scripts/alphazerobeta_prepare.py \
            --prices-csv /tmp/jquants-free/prices.csv \
            --benchmark-csv /tmp/jquants-free/benchmark.csv \
            --output /tmp/alphazerobeta-japan/panel.npz \
            --max-assets 64 \
            --universe-cutoff "$UNIVERSE_CUTOFF"
      - name: Execute two OOS folds and matched correlation-penalty ablation
        shell: bash
        run: |
          set -euo pipefail
          for fold in 0 1; do
            seed=$((2306 + fold))
            python scripts/alphazerobeta_japan_free_train.py \
              --dataset /tmp/alphazerobeta-japan/panel.npz \
              --output "/tmp/alphazerobeta-japan/primary-fold${fold}.json" \
              --test-start "$TEST_START" --test-end "$TEST_END" --fold-index "$fold" \
              --device cpu --seed "$seed" --iterations 10 --horizon 200 \
              --hidden-size 512 --agent-window 100 \
              --transaction-cost-bps 15 --borrow-fee-bps 30 \
              --lambda-corr 0.5 --lambda-turnover 0.001 --reward-semantics paper
            python scripts/alphazerobeta_japan_free_train.py \
              --dataset /tmp/alphazerobeta-japan/panel.npz \
              --output "/tmp/alphazerobeta-japan/ablation-fold${fold}.json" \
              --test-start "$TEST_START" --test-end "$TEST_END" --fold-index "$fold" \
              --device cpu --seed "$seed" --iterations 10 --horizon 200 \
              --hidden-size 512 --agent-window 100 \
              --transaction-cost-bps 15 --borrow-fee-bps 30 \
              --lambda-corr 0 --lambda-turnover 0.001 --reward-semantics paper
          done
      - name: Compare OOS evidence
        run: |
          python scripts/alphazerobeta_compare.py \
            --dataset /tmp/alphazerobeta-japan/panel.npz \
            --primary-weights /tmp/alphazerobeta-japan/primary-fold0.weights.npz /tmp/alphazerobeta-japan/primary-fold1.weights.npz \
            --ablation-weights /tmp/alphazerobeta-japan/ablation-fold0.weights.npz /tmp/alphazerobeta-japan/ablation-fold1.weights.npz \
            --output /tmp/alphazerobeta-japan/comparison.json \
            --transaction-cost-bps 15 --borrow-fee-bps 30
      - name: Persist non-raw provenance and measured results
        shell: bash
        run: |
          set -euo pipefail
          target=docs/research/results/alphazerobeta_jquants_free
          rm -rf "$target"
          mkdir -p "$target"
          cp /tmp/jquants-free/manifest.json "$target/source-manifest.json"
          cp /tmp/alphazerobeta-japan/panel.npz.manifest.json "$target/dataset-manifest.json"
          cp /tmp/alphazerobeta-japan/primary-fold*.json "$target/"
          cp /tmp/alphazerobeta-japan/ablation-fold*.json "$target/"
          cp /tmp/alphazerobeta-japan/comparison.json "$target/"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("docs/research/results/alphazerobeta_jquants_free")
          source = json.loads((root / "source-manifest.json").read_text())
          dataset = json.loads((root / "dataset-manifest.json").read_text())
          comparison = json.loads((root / "comparison.json").read_text())
          payload = {
              "schema_version": "investor2.alphazerobeta-jquants-free-validation.v1",
              "execution_status": "completed",
              "source": source,
              "trained_asset_count": len(dataset["selected_codes"]),
              "selected_codes": dataset["selected_codes"],
              "walk_forward": {"train_months": 8, "validation_months": 2, "test_months": 3, "folds": 2},
              "primary_lambda_corr_0_5": comparison["primary_lambda_corr_0_5"],
              "ablation_lambda_corr_0": comparison["ablation_lambda_corr_0"],
              "gates": comparison["gates"],
              "verdict": comparison["verdict"],
              "claim_boundary": "J-Quants Free Japanese surrogate with paper model/reward semantics; not the licensed-data paper experiment.",
              "raw_retention": "none; raw J-Quants records were deleted after validation and were not committed or uploaded",
          }
          (root / "summary.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(payload, ensure_ascii=False))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m "research: persist J-Quants Free AlphaZeroBeta evidence"
            git push origin HEAD:research/alphazerobeta-jquants-free-validation
          fi
      - name: Remove raw J-Quants staging data
        if: always()
        run: rm -rf /tmp/jquants-free /tmp/alphazerobeta-japan
