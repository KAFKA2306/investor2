name: AlphaZeroBeta J-Quants Free Japan validation

on:
  push:
    branches:
      - research/alphazerobeta-jquants-free-validation-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alphazerobeta-jquants-free-validation-v2
  cancel-in-progress: true

# Empirical acquisition is explicitly gated by the [snapshot] commit marker.
# Acquisition jobs run serially so the Free 5-calls/minute limit is never shared across jobs.
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install contract dependencies
        run: python -m pip install ruff
      - name: Verify entry points
        run: |
          ruff format --check \
            scripts/alphazerobeta_jquants_free_collect.py \
            scripts/alphazerobeta_japan_free_train.py
          ruff check \
            scripts/alphazerobeta_jquants_free_collect.py \
            scripts/alphazerobeta_japan_free_train.py
          python -m py_compile \
            scripts/alphazerobeta_jquants_free_collect.py \
            scripts/alphazerobeta_japan_free_train.py

  snapshot-and-validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[snapshot]'))
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/alphazerobeta-jquants-free-validation-v2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require J-Quants credential
        run: test -n "$JQUANTS_API_KEY"
      - name: Install execution dependencies
        run: |
          python -m pip install jquants-api-client numpy pandas pyarrow pydantic
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Acquire full Free equity core
        run: |
          rm -rf /tmp/jquants-free-core /tmp/alphazerobeta-japan
          python scripts/alphazerobeta_jquants_free_collect.py \
            --scope core \
            --output-dir /tmp/jquants-free-core
      - name: Resolve bounded validation dates
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('/tmp/jquants-free-core')
          manifest = json.loads((root / 'manifest.json').read_text())
          actual_end = pd.Timestamp(manifest['actual_date_range']['end'])
          test_end = actual_end
          test_start = test_end - pd.DateOffset(months=6) + pd.Timedelta(days=1)
          universe_cutoff = test_start - pd.DateOffset(months=2) - pd.Timedelta(days=1)
          print(f"TEST_START={test_start.date()}")
          print(f"TEST_END={test_end.date()}")
          print(f"UNIVERSE_CUTOFF={universe_cutoff.date()}")
          PY
      - name: Prepare PIT-safe top-64 liquid panel from the full equity universe
        run: |
          mkdir -p /tmp/alphazerobeta-japan
          python - <<'PY'
          import pandas as pd

          pd.read_parquet('/tmp/jquants-free-core/prices.parquet').to_csv(
              '/tmp/alphazerobeta-japan/prices.csv', index=False
          )
          pd.read_parquet('/tmp/jquants-free-core/benchmark.parquet').to_csv(
              '/tmp/alphazerobeta-japan/benchmark.csv', index=False
          )
          PY
          python scripts/alphazerobeta_prepare.py \
            --prices-csv /tmp/alphazerobeta-japan/prices.csv \
            --benchmark-csv /tmp/alphazerobeta-japan/benchmark.csv \
            --output /tmp/alphazerobeta-japan/panel.npz \
            --max-assets 64 \
            --universe-cutoff "$UNIVERSE_CUTOFF"
          rm -f /tmp/alphazerobeta-japan/prices.csv /tmp/alphazerobeta-japan/benchmark.csv
      - name: Execute two OOS folds and matched correlation-penalty ablation
        shell: bash
        run: |
          set -euo pipefail
          for fold in 0 1; do
            seed=$((2306 + fold))
            python scripts/alphazerobeta_japan_free_train.py \
              --dataset /tmp/alphazerobeta-japan/panel.npz \
              --output "/tmp/alphazerobeta-japan/primary-fold${fold}.json" \
              --test-start "$TEST_START" --test-end "$TEST_END" --fold-index "$fold" \
              --device cpu --seed "$seed" --iterations 10 --horizon 200 \
              --hidden-size 512 --agent-window 100 \
              --transaction-cost-bps 15 --borrow-fee-bps 100 \
              --lambda-corr 0.5 --lambda-turnover 0.001 --reward-semantics paper
            python scripts/alphazerobeta_japan_free_train.py \
              --dataset /tmp/alphazerobeta-japan/panel.npz \
              --output "/tmp/alphazerobeta-japan/ablation-fold${fold}.json" \
              --test-start "$TEST_START" --test-end "$TEST_END" --fold-index "$fold" \
              --device cpu --seed "$seed" --iterations 10 --horizon 200 \
              --hidden-size 512 --agent-window 100 \
              --transaction-cost-bps 15 --borrow-fee-bps 100 \
              --lambda-corr 0 --lambda-turnover 0.001 --reward-semantics paper
          done
      - name: Compare OOS evidence
        run: |
          python scripts/alphazerobeta_compare.py \
            --dataset /tmp/alphazerobeta-japan/panel.npz \
            --primary-weights /tmp/alphazerobeta-japan/primary-fold0.weights.npz /tmp/alphazerobeta-japan/primary-fold1.weights.npz \
            --ablation-weights /tmp/alphazerobeta-japan/ablation-fold0.weights.npz /tmp/alphazerobeta-japan/ablation-fold1.weights.npz \
            --output /tmp/alphazerobeta-japan/comparison.json \
            --transaction-cost-bps 15 --borrow-fee-bps 100
      - name: Persist core provenance and empirical evidence
        shell: bash
        run: |
          set -euo pipefail
          target=docs/research/results/alphazerobeta_jquants_free
          rm -rf "$target"
          mkdir -p "$target"
          cp /tmp/jquants-free-core/manifest.json "$target/source-core-manifest.json"
          cp /tmp/alphazerobeta-japan/panel.npz.manifest.json "$target/dataset-manifest.json"
          cp /tmp/alphazerobeta-japan/primary-fold*.json "$target/"
          cp /tmp/alphazerobeta-japan/ablation-fold*.json "$target/"
          cp /tmp/alphazerobeta-japan/comparison.json "$target/"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('docs/research/results/alphazerobeta_jquants_free')
          source = json.loads((root / 'source-core-manifest.json').read_text())
          dataset = json.loads((root / 'dataset-manifest.json').read_text())
          comparison = json.loads((root / 'comparison.json').read_text())
          payload = {
              'schema_version': 'investor2.alphazerobeta-jquants-free-validation.v4',
              'execution_status': 'empirical_validation_complete',
              'free_scope_status': 'core_complete_metadata_pending',
              'source_core': {
                  'source': source['source'],
                  'plan': source['plan'],
                  'actual_date_range': source['actual_date_range'],
                  'ticker_count': source['ticker_count'],
                  'price_rows': source['price_rows'],
                  'trading_calendar_rows': source['trading_calendar_rows'],
                  'http_requests': source['http_requests'],
                  'retention': source['retention'],
              },
              'trained_asset_count': len(dataset['selected_codes']),
              'selected_codes': dataset['selected_codes'],
              'universe_cutoff': dataset['universe_cutoff'],
              'walk_forward': {
                  'train_months': 8,
                  'validation_months': 2,
                  'test_months': 3,
                  'folds': 2,
              },
              'primary_lambda_corr_0_5': comparison['primary_lambda_corr_0_5'],
              'ablation_lambda_corr_0': comparison['ablation_lambda_corr_0'],
              'gates': comparison['gates'],
              'verdict': comparison['verdict'],
              'benchmark': source['benchmark'],
              'claim_boundary': (
                  'Complete J-Quants Free equity core used for PIT universe selection; '
                  'top-64 liquid panel used for bounded AlphaZeroBeta CPU validation. '
                  'This is not the licensed-data paper experiment.'
              ),
          }
          (root / 'summary.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "research: persist J-Quants Free AlphaZeroBeta evidence [evidence]"
          git push origin HEAD:research/alphazerobeta-jquants-free-validation-v2
      - name: Remove raw J-Quants core
        if: always()
        run: rm -rf /tmp/jquants-free-core

  free-metadata-audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[snapshot]'))
    needs: snapshot-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/alphazerobeta-jquants-free-validation-v2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require J-Quants credential
        run: test -n "$JQUANTS_API_KEY"
      - name: Install acquisition dependencies
        run: python -m pip install jquants-api-client numpy pandas pyarrow
      - name: Acquire all remaining Free metadata over every calendar date
        run: |
          rm -rf /tmp/jquants-free-metadata
          python scripts/alphazerobeta_jquants_free_collect.py \
            --scope metadata \
            --output-dir /tmp/jquants-free-metadata
      - name: Prove complete current Free-plan coverage
        shell: bash
        run: |
          set -euo pipefail
          target=docs/research/results/alphazerobeta_jquants_free
          cp /tmp/jquants-free-metadata/manifest.json "$target/source-metadata-manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('docs/research/results/alphazerobeta_jquants_free')
          core = json.loads((root / 'source-core-manifest.json').read_text())
          metadata = json.loads((root / 'source-metadata-manifest.json').read_text())
          summary = json.loads((root / 'summary.json').read_text())
          official = set(core['official_free_datasets'])
          collected = (
              set(core['collected_datasets']) | set(metadata['collected_datasets'])
          ) - {'benchmark'}
          if collected != official:
              raise AssertionError(
                  f"Free-plan coverage mismatch: missing={sorted(official-collected)}, "
                  f"unexpected={sorted(collected-official)}"
              )
          coverage = {
              'schema_version': 'investor2.jquants-free-coverage.v1',
              'status': 'complete',
              'official_free_datasets': sorted(official),
              'collected_datasets': sorted(collected),
              'core_http_requests': core['http_requests'],
              'metadata_http_requests': metadata['http_requests'],
              'metadata_calendar_days_scanned': metadata['calendar_days_scanned'],
              'financial_summary_rows': metadata['financial_summary_rows'],
              'earnings_date_rows': metadata['earnings_date_rows'],
              'earnings_calendar_rows': metadata['earnings_calendar_rows'],
              'retention': metadata['retention'],
          }
          (root / 'free-scope-summary.json').write_text(
              json.dumps(coverage, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          )
          summary['free_scope_status'] = 'complete'
          summary['source_metadata'] = {
              'calendar_days_scanned': metadata['calendar_days_scanned'],
              'financial_summary_rows': metadata['financial_summary_rows'],
              'earnings_date_rows': metadata['earnings_date_rows'],
              'earnings_calendar_rows': metadata['earnings_calendar_rows'],
              'http_requests': metadata['http_requests'],
          }
          (root / 'summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(coverage, ensure_ascii=False, sort_keys=True))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "research: persist complete J-Quants Free coverage evidence [evidence]"
          git push origin HEAD:research/alphazerobeta-jquants-free-validation-v2
      - name: Remove raw J-Quants metadata
        if: always()
        run: rm -rf /tmp/jquants-free-metadata
