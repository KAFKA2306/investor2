name: Reproduce Zhang 1911.10107 v1

on:
  push:
    branches:
      - research/2019-zhang-reproduction
    paths:
      - "scripts/run_zhang_1911_10107_empirical.py"
      - "tests/test_zhang_1911_10107_empirical.py"
      - "docs/research/protocols/zhang_1911_10107_v1_dqn_table2.json"
      - ".github/workflows/zhang-1911-10107-reproduction.yml"
  pull_request:
    paths:
      - "scripts/run_zhang_1911_10107_empirical.py"
      - "tests/test_zhang_1911_10107_empirical.py"
      - "docs/research/protocols/zhang_1911_10107_v1_dqn_table2.json"
      - "docs/research/catalogs/2019_arxiv_finance_registry.json"
      - "docs/research/runs/zhang_1911_10107_v1_dqn_table2_seed2306/**"
      - ".github/workflows/zhang-1911-10107-reproduction.yml"

permissions:
  contents: write

concurrency:
  group: zhang-1911-10107-${{ github.ref }}
  cancel-in-progress: false

jobs:
  empirical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile and test method/data gates
        run: |
          python -m py_compile scripts/run_zhang_1911_10107_empirical.py scripts/verify_2019_arxiv_empirical.py
          python tests/test_zhang_1911_10107_empirical.py

      - name: Acquire exact pinned paper bytes for hash-only provenance
        if: github.event_name == 'push'
        run: |
          curl --fail --location --retry 5 --retry-delay 3 \
            --user-agent 'investor2-reproduction/1.0' \
            https://arxiv.org/pdf/1911.10107v1 \
            --output /tmp/1911.10107v1.pdf
          test -s /tmp/1911.10107v1.pdf
          sha256sum /tmp/1911.10107v1.pdf

      - name: Execute locked paper-specific protocol
        if: github.event_name == 'push'
        run: |
          python scripts/run_zhang_1911_10107_empirical.py \
            --protocol docs/research/protocols/zhang_1911_10107_v1_dqn_table2.json \
            --data-contracts docs/research/catalogs/arxiv_qfin_2019_data_requirements.json \
            --split-contracts docs/research/contracts/arxiv_qfin_2019_split_contracts.json \
            --source-pdf /tmp/1911.10107v1.pdf \
            --output-dir docs/research/runs/zhang_1911_10107_v1_dqn_table2_seed2306

      - name: Enforce terminal evidence and append registry
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          run_dir = root / 'docs/research/runs/zhang_1911_10107_v1_dqn_table2_seed2306'
          manifest_path = run_dir / 'manifest.json'
          report_path = run_dir / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8'))
          assert report['empirical_reproduction_state'] == 'EMPIRICALLY_RUN'
          assert report['empirical_verdict'] == 'BLOCKED'
          assert report['training_attempted'] is True
          assert report['training_executed'] is False
          assert report['evaluation_executed'] is False
          assert report['observed_metrics'] is None
          assert report['metric_delta'] is None
          assert report['reason_codes'] == ['PINNACLE_CLC_DATA_DIR_NOT_CONFIGURED'], report['reason_codes']
          assert report['paper_target']['metric'] == 'annualized_sharpe'
          assert report['paper_target']['value'] == 1.288
          assert report['paper_target']['training_cost_rate'] == 0.0020
          assert report['paper_target']['training_cost_bps'] == 20.0
          assert report['split_contract_consumed']['test_window'] == {'start': 2011, 'end': 2019, 'precision': 'YEAR'}
          assert report['split_contract_consumed']['model_selection_rule'] == 'NOT_SPECIFIED'

          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          registry_path = root / 'docs/research/catalogs/2019_arxiv_finance_registry.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          papers = [p for p in registry['papers'] if p.get('id') != 'zhang_1911_10107_v1']
          papers.append({
              'id': 'zhang_1911_10107_v1',
              'arxiv_id': '1911.10107',
              'title': 'Deep Reinforcement Learning for Trading',
              'source_url': 'https://arxiv.org/abs/1911.10107v1',
              'source_pdf_url': 'https://arxiv.org/pdf/1911.10107v1',
              'source_version': 'v1',
              'method_contract_state': 'PASS',
              'data_contract_state': 'VERIFIED_FULL_TEXT_PROPRIETARY_INPUT_BLOCKED',
              'split_contract_state': 'VERIFIED_FULL_TEXT_WITH_NOT_SPECIFIED_VALIDATION',
              'empirical_reproduction_state': 'EMPIRICALLY_RUN',
              'empirical_verdict': 'BLOCKED',
              'stage_reached': report['stage_reached'],
              'paper_target': report['paper_target'],
              'observed_metrics': None,
              'reason_codes': report['reason_codes'],
              'evidence_manifest': manifest_path.as_posix(),
              'evidence_manifest_sha256': manifest_sha,
          })
          registry['papers'] = sorted(papers, key=lambda p: p['id'])
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'manifest_sha256': manifest_sha, 'verdict': 'BLOCKED', 'paper_count': len(registry['papers'])}, sort_keys=True))
          PY
          python scripts/verify_2019_arxiv_empirical.py

      - name: Commit immutable run evidence to materialization branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            docs/research/catalogs/2019_arxiv_finance_registry.json \
            docs/research/runs/zhang_1911_10107_v1_dqn_table2_seed2306/manifest.json \
            docs/research/runs/zhang_1911_10107_v1_dqn_table2_seed2306/report.json \
            docs/research/runs/zhang_1911_10107_v1_dqn_table2_seed2306/trace.json
          git commit -m "Record Zhang v1 DQN empirical BLOCKED evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Validate committed empirical evidence on pull request
        if: github.event_name == 'pull_request'
        run: |
          python scripts/verify_2019_arxiv_empirical.py
          git diff --exit-code -- \
            docs/research/catalogs/2019_arxiv_finance_registry.json \
            docs/research/runs/zhang_1911_10107_v1_dqn_table2_seed2306
