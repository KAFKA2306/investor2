name: Research PIT vintage audit

on:
  pull_request:
    paths:
      - "scripts/audit_french_factor_vintages.py"
      - "scripts/compare_french_factor_revisions.py"
      - "scripts/verify_paper_factor_suite.py"
      - "docs/research/paper_factor_registry.json"
      - "docs/research/kenneth_french_factor_vintage_contract.json"
      - "docs/research/kenneth_french_current_snapshot_2026-06.json"
      - "docs/research/multi_paper_oos_summary.md"
      - "docs/research/official_current_paper_factor_suite.json"
      - "docs/research/data/ff3_1992_2026-06.csv"
      - "docs/research/data/ff5_2015_2026-06.csv"
      - ".github/workflows/research-pit-vintage-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empirical-vintage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile audit
        run: |
          python -m py_compile scripts/audit_french_factor_vintages.py
          python -m py_compile scripts/compare_french_factor_revisions.py
          python -m py_compile scripts/verify_paper_factor_suite.py

      - name: Validate current pinned official suite
        run: |
          mkdir -p artifacts
          python scripts/verify_paper_factor_suite.py \
            --registry docs/research/paper_factor_registry.json \
            --json-output artifacts/official-current-paper-factor-suite.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/official-current-paper-factor-suite.json").read_text())
          snapshot = json.loads(Path("docs/research/kenneth_french_current_snapshot_2026-06.json").read_text())
          datasets = report["datasets"]
          studies = report["studies"]

          assert snapshot["authority"] == "official_primary"
          assert snapshot["pinned_last_observation"] == "2026-06"
          assert snapshot["generation_regime"]["current_release"] == "CIZ"
          assert len(studies) == 7

          ff3 = datasets["ff3_1992_2020"]
          assert ff3["authority"] == "official_primary"
          assert (ff3["rows"], ff3["first_observation"], ff3["last_observation"]) == (408, "1992-07", "2026-06")
          assert ff3["actual_sha256"] == "0f7ad8a9303c54c87da2cd45df3f9fdfd36d39e74ce373f6bd84567276835fcf"

          ff5 = datasets["ff5_2015_2020"]
          assert ff5["authority"] == "official_primary"
          assert (ff5["rows"], ff5["first_observation"], ff5["last_observation"]) == (134, "2015-05", "2026-06")
          assert ff5["actual_sha256"] == "a608eca851e909aa18c63c5e58e81160adde81df1cac7b65cb4d33d04925c4a3"

          assert studies["fama_french_1993_smb"]["gross_results"]["full_oos"]["months"] == 400
          assert studies["fama_french_2015_rmw"]["gross_results"]["full_oos"]["months"] == 134
          assert all(study["verdict"] in {"not_confirmed", "proxy_not_confirmed"} for study in studies.values())
          PY

      - name: Run empirical audit against Kenneth French July 2020 archives
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import pathlib
          import sys

          source = pathlib.Path("scripts/audit_french_factor_vintages.py")
          spec = importlib.util.spec_from_file_location("french_vintage_audit", source)
          module = importlib.util.module_from_spec(spec)
          sys.modules["french_vintage_audit"] = module
          spec.loader.exec_module(module)
          report = module.build_report()

          summary = report["summary"]
          if summary["factor_studies_retested"] != 7:
              raise SystemExit("expected seven factor studies")
          if not summary["portfolio_leg_reconstruction_pass"]:
              raise SystemExit("archived portfolio-leg reconstruction failed")

          output = pathlib.Path("artifacts/french-2020-vintage-empirical-audit.json")
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Compare current factors with the July 2020 archive
        run: |
          python scripts/compare_french_factor_revisions.py \
            --output artifacts/french-factor-revision-comparison.json

      - name: Upload empirical evidence
        uses: actions/upload-artifact@v4
        with:
          name: french-factor-evidence
          path: |
            artifacts/official-current-paper-factor-suite.json
            artifacts/french-2020-vintage-empirical-audit.json
            artifacts/french-factor-revision-comparison.json
          if-no-files-found: error
          retention-days: 30
