name: Research PIT vintage audit

on:
  pull_request:
    paths:
      - "scripts/audit_french_factor_vintages.py"
      - "scripts/verify_paper_factor_suite.py"
      - "docs/research/paper_factor_registry.json"
      - "docs/research/data/ff3_1992_2020.csv"
      - "docs/research/data/ff5_2015_2020.csv"
      - ".github/workflows/research-pit-vintage-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empirical-vintage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile audit
        run: python -m py_compile scripts/audit_french_factor_vintages.py

      - name: Run empirical audit against Kenneth French July 2020 archives
        run: |
          mkdir -p artifacts
          python scripts/audit_french_factor_vintages.py \
            --output artifacts/french-2020-vintage-empirical-audit.json

      - name: Upload empirical evidence
        uses: actions/upload-artifact@v4
        with:
          name: french-2020-vintage-empirical-audit
          path: artifacts/french-2020-vintage-empirical-audit.json
          if-no-files-found: error
          retention-days: 30
