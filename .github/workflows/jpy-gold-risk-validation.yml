name: JPY gold risk validation
on:
  pull_request:
    paths:
      - scripts/qqq_gold_jpy_validation.py
      - .github/workflows/jpy-gold-risk-validation.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: Run JPY validation
        run: python scripts/qqq_gold_jpy_validation.py
