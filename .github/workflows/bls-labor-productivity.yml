name: Collect BLS labor productivity

on:
  workflow_dispatch:
  schedule:
    - cron: "47 14 * * 1-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/bls-labor-productivity.yml"
      - "scripts/bls_labor_productivity_snapshot.py"
      - "tests/test_bls_labor_productivity_snapshot.py"
      - "docs/data-sources/bls-labor-productivity.md"
  pull_request:
    paths:
      - ".github/workflows/bls-labor-productivity.yml"
      - "scripts/bls_labor_productivity_snapshot.py"
      - "tests/test_bls_labor_productivity_snapshot.py"
      - "docs/data-sources/bls-labor-productivity.md"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download official BLS Series Reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bls-productivity
          for series in PRS85006091 PRS85006093; do
            curl --fail --location --retry 1 \
              --user-agent "KAFKA2306/investor2 (+https://github.com/KAFKA2306/investor2/issues)" \
              --data-urlencode "request_action=get_data" \
              --data-urlencode "reformat=true" \
              --data-urlencode "from_results_page=true" \
              --data-urlencode "from_year=1948" \
              --data-urlencode "to_year=2026" \
              --data-urlencode "annualAveragesRequested=true" \
              --data-urlencode "initial_request=false" \
              --data-urlencode "data_tool=latest_numbers" \
              --data-urlencode "series_id=$series" \
              --data-urlencode "original_annualAveragesRequested=false" \
              "https://data.bls.gov/pdq/SurveyOutputServlet" \
              -o "/tmp/bls-productivity/$series.html"
          done

      - name: Run focused regression tests
        run: python -m unittest -v tests.test_bls_labor_productivity_snapshot

      - name: Verify official data on pull requests
        if: github.event_name == 'pull_request'
        run: |
          python scripts/bls_labor_productivity_snapshot.py \
            --percent-html /tmp/bls-productivity/PRS85006091.html \
            --index-html /tmp/bls-productivity/PRS85006093.html \
            --output-dir /tmp/bls-snapshots \
            --latest-path /tmp/bls-latest.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/bls-latest.json').read_text())
          print({
              'first_year': payload['first_year'],
              'latest_year': payload['latest_year'],
              'records': len(payload['records']),
              'latest': payload['records'][-1],
          })
          PY

      - name: Materialize canonical snapshot
        id: materialize
        if: github.event_name != 'pull_request'
        run: |
          artifact=$(python scripts/bls_labor_productivity_snapshot.py \
            --percent-html /tmp/bls-productivity/PRS85006091.html \
            --index-html /tmp/bls-productivity/PRS85006093.html \
            --output-dir data/snapshots/bls_labor_productivity \
            --latest-path data/bls_labor_productivity/latest.json)
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Register and commit changed data
        if: github.event_name != 'pull_request'
        env:
          ARTIFACT: ${{ steps.materialize.outputs.artifact }}
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch "$ARTIFACT" >/dev/null 2>&1 && \
             git diff --quiet -- data/bls_labor_productivity/latest.json; then
            echo 'No new normalized BLS labor-productivity snapshot.'
            exit 0
          fi

          if git ls-files --error-unmatch "$ARTIFACT" >/dev/null 2>&1; then
            echo "Latest view changed without a new content-addressed artifact: $ARTIFACT" >&2
            exit 1
          fi

          retrieved_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          provenance=$(RETRIEVED_AT="$retrieved_at" python - <<'PY'
          import json
          import os

          print(json.dumps({
              'tool': 'GitHub Actions curl + repository parser',
              'operation': 'download BLS Series Report annual-average output and normalize two official series',
              'query_or_scope': 'Nonfarm Business labor productivity annual history, 1948-present; PRS85006091 and PRS85006093',
              'retrieved_at': os.environ['RETRIEVED_AT'],
              'source_urls': [
                  'https://data.bls.gov/timeseries/PRS85006091',
                  'https://data.bls.gov/timeseries/PRS85006093',
                  'https://data.bls.gov/pdq/SurveyOutputServlet',
                  'https://www.bls.gov/productivity/tables/home.htm',
              ],
          }, separators=(',', ':')))
          PY
          )

          python scripts/snapshot_store.py register \
            --dataset-id bls_nonfarm_business_labor_productivity_annual \
            --reuse-key us/bls/nonfarm-business/labor-productivity/annual \
            --artifact-path "$ARTIFACT" \
            --source public_web_research \
            --source-kind official_web \
            --observed-at "$retrieved_at" \
            --schema-version investor2.bls-nonfarm-business-labor-productivity-annual.v1 \
            --provenance-json "$provenance"
          python scripts/snapshot_store.py audit >/dev/null

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$ARTIFACT" data/bls_labor_productivity/latest.json data/input_ledger/snapshot_catalog.ndjson
          git commit -m 'data: snapshot BLS labor productivity'
          git push
