name: Collect BLS labor productivity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/bls-labor-productivity.yml"

permissions:
  contents: read

jobs:
  probe-series-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Show Ruff formatting diff
        run: uvx --from ruff==0.15.5 ruff format --diff scripts/bls_labor_productivity_snapshot.py tests/test_bls_labor_productivity_snapshot.py
      - name: Probe official BLS annual-average output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bls-productivity
          for series in PRS85006091 PRS85006093; do
            curl --fail --location --retry 1 \
              --user-agent "KAFKA2306/investor2 (+https://github.com/KAFKA2306/investor2/issues)" \
              --data-urlencode "request_action=get_data" \
              --data-urlencode "reformat=true" \
              --data-urlencode "from_results_page=true" \
              --data-urlencode "from_year=1948" \
              --data-urlencode "to_year=2026" \
              --data-urlencode "annualAveragesRequested=true" \
              --data-urlencode "initial_request=false" \
              --data-urlencode "data_tool=latest_numbers" \
              --data-urlencode "series_id=$series" \
              --data-urlencode "original_annualAveragesRequested=false" \
              "https://data.bls.gov/pdq/SurveyOutputServlet" \
              -o "/tmp/bls-productivity/$series.html"
            echo "=== $series headers/annual rows ==="
            grep -E -i -m 12 '<TH scope="col">|<TH scope="row">(1948|2023|2024|2025)</TH>' "/tmp/bls-productivity/$series.html" || true
            grep -E -i -m 8 'Annual|annual average' "/tmp/bls-productivity/$series.html" || true
          done
