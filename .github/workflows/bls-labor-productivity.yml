name: Collect BLS labor productivity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/bls-labor-productivity.yml"

permissions:
  contents: read

jobs:
  probe-series-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect official BLS Series Report form
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bls-productivity
          curl --fail --location --retry 1 \
            --user-agent "KAFKA2306/investor2 (+https://github.com/KAFKA2306/investor2/issues)" \
            "https://data.bls.gov/timeseries/PRS85006091" \
            -o /tmp/bls-productivity/series.html
          echo "=== forms ==="
          grep -n -i -E '<form|</form>' /tmp/bls-productivity/series.html || true
          echo "=== annual average neighborhood ==="
          grep -n -i -B 12 -A 24 'annualAveragesRequested' /tmp/bls-productivity/series.html || true
          echo "=== input/select names ==="
          grep -E -i '<(input|select)[^>]+(name|id)=' /tmp/bls-productivity/series.html | tail -80 || true
