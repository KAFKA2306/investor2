name: Prune unused Python dependencies once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bls-labor-productivity.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Remove unused direct dependencies
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          dependencies = [
              "anthropic",
              "browser-use",
              "ghat",
              "langchain-openai",
              "loguru",
              "pdfminer.six",
              "pillow",
              "playwright",
              "polars",
              "protobuf",
              "pyqlib",
              "accelerate",
              "autoawq",
              "compressed-tensors",
              "torchvision",
              "transformers",
              "chronos-forecasting",
              "timesfm",
              "datasets",
          ]
          for dependency in dependencies:
              line = f'    "{dependency}",\n'
              if text.count(line) != 1:
                  raise SystemExit(f"unexpected dependency occurrence: {dependency}")
              text = text.replace(line, "")
          path.write_text(text, encoding="utf-8")
          PY
          uv lock
          uv lock --check
          git diff --check
      - name: Verify removed roots are absent from lock
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("pyproject.toml").read_text()
          for dependency in (
              "anthropic", "browser-use", "ghat", "langchain-openai", "loguru", "pdfminer.six",
              "pillow", "playwright", "polars", "protobuf", "pyqlib", "accelerate", "autoawq",
              "compressed-tensors", "torchvision", "transformers", "chronos-forecasting", "timesfm", "datasets",
          ):
              assert f'"{dependency}"' not in text, dependency
          PY
      - name: Commit dependency prune
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "refactor: remove unused Python dependencies"
          git pull --rebase origin main
          git push origin HEAD:main
