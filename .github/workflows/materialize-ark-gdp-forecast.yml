name: Materialize ARK GDP forecast evidence

on:
  push:
    branches: [feat/ark-gdp-forecast-comparison]
    paths:
      - '.github/workflows/materialize-ark-gdp-forecast.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Register source snapshot
        run: |
          python scripts/snapshot_store.py register \
            --dataset-id ark-big-ideas-2026-great-acceleration-forecast-source \
            --reuse-key ark-big-ideas/2026/great-acceleration/forecast-source \
            --artifact-path data/ark-big-ideas/snapshots/ark-big-ideas-2026-great-acceleration-forecast-source.json \
            --source public_web_research \
            --source-kind official_web \
            --observed-at '2026-08-21T19:03:31+09:00' \
            --schema-version investor2.ark-big-ideas-forecast-source.v1 \
            --provenance-json '{"tool":"ChatGPT web.run","operation":"primary-source verification","query_or_scope":"ARK Big Ideas 2026 The Great Acceleration global real GDP growth forecast, page 11","retrieved_at":"2026-08-21T19:03:31+09:00","source_urls":["https://research.ark-invest.com/hubfs/1_Download_Files_ARK-Invest/Big_Ideas/ARKInvest%20BigIdeas2026.pdf","https://www.ark-invest.com/newsletters/issue-500","https://www.ark-invest.com/big-ideas-2026"]}'
      - name: Rebuild comparison views
        run: python scripts/build_ark_forecast_comparison.py
      - name: Verify focused contracts
        run: |
          python -m unittest tests.test_ark_forecast_catalog tests.test_ark_forecast_comparison -v
          python scripts/snapshot_store.py audit > /tmp/snapshot-audit.json
      - name: Commit canonical materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/input_ledger/snapshot_catalog.ndjson
          git add api/v1/ark-big-ideas/forecast-comparison.json api/v1/ark-big-ideas/forecast-comparison.csv
          git commit -m 'data: materialize ARK GDP forecast comparison'
          git push
