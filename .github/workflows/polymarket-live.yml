name: Polymarket live source health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/io/providers/polymarket.py"
      - "scripts/polymarket_snapshot.py"
      - "data/input_ledger/source_registry.d/polymarket_market_data.json"
      - ".github/workflows/polymarket-live.yml"
  push:
    branches: [main]
    paths:
      - "src/io/providers/polymarket.py"
      - "scripts/polymarket_snapshot.py"
      - "data/input_ledger/source_registry.d/polymarket_market_data.json"
      - ".github/workflows/polymarket-live.yml"

permissions:
  contents: read

concurrency:
  group: polymarket-live-source-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: Validate live Gamma and CLOB access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Install minimal health runtime
        run: |
          uv venv .polymarket-venv
          uv pip install --python .polymarket-venv/bin/python requests==2.32.5 pydantic==2.12.5
      - name: Validate Gamma discovery without publishing observations
        run: .polymarket-venv/bin/python scripts/polymarket_snapshot.py --health-gamma
      - name: Validate CLOB quotes without publishing observations
        run: .polymarket-venv/bin/python scripts/polymarket_snapshot.py --health-only
