name: Polymarket live source health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/io/providers/polymarket.py"
      - "scripts/polymarket_snapshot.py"
      - "data/input_ledger/source_registry.d/polymarket_market_data.json"
      - ".github/workflows/polymarket-live.yml"
  push:
    branches: [main]
    paths:
      - "src/io/providers/polymarket.py"
      - "scripts/polymarket_snapshot.py"
      - "data/input_ledger/source_registry.d/polymarket_market_data.json"
      - ".github/workflows/polymarket-live.yml"

permissions:
  contents: read

concurrency:
  group: polymarket-live-source-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  health:
    name: Validate live Gamma and CLOB access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Install locked runtime
        run: uv sync --locked
      - name: Validate Gamma discovery without publishing observations
        shell: bash
        run: |
          if uv run --no-sync python scripts/polymarket_snapshot.py --health-gamma >/dev/null 2>&1; then
            echo '{"schema_version":"investor2.polymarket-source-health.v1","stage":"gamma","status":"PASS"}'
          else
            echo '{"schema_version":"investor2.polymarket-source-health.v1","stage":"gamma","status":"FAIL"}'
            exit 1
          fi
      - name: Validate CLOB quotes without publishing observations
        shell: bash
        run: |
          if uv run --no-sync python scripts/polymarket_snapshot.py --health-only >/dev/null 2>&1; then
            echo '{"schema_version":"investor2.polymarket-source-health.v1","stage":"clob","status":"PASS"}'
          else
            echo '{"schema_version":"investor2.polymarket-source-health.v1","stage":"clob","status":"FAIL"}'
            exit 1
          fi
