name: Temporary issue 194 formatter

on:
  push:
    branches: [issue-194-readme-frontier-current]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-194-readme-frontier-current
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Format changed Python files
        run: uvx --from ruff==0.15.5 ruff format scripts/paper_family_frontier.py tests/test_paper_family_frontier.py scripts/alphacrafter_jquants_frontier.py
      - name: Persist formatter output
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/paper_family_frontier.py tests/test_paper_family_frontier.py scripts/alphacrafter_jquants_frontier.py
          git commit -m "style: apply Ruff formatter"
          git push origin HEAD:issue-194-readme-frontier-current
