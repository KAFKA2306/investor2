name: Temporary snapshot hotfix formatter

on:
  push:
    branches:
      - fix/snapshot-store-registry-fragments
    paths:
      - ".github/workflows/_temp-format-snapshot-hotfix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/snapshot-store-registry-fragments
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Apply repository-pinned Ruff
        run: |
          uvx ruff==0.15.5 check --fix scripts/snapshot_store.py tests/test_snapshot_store.py
          uvx ruff==0.15.5 format scripts/snapshot_store.py tests/test_snapshot_store.py
          uvx ruff==0.15.5 check scripts/snapshot_store.py tests/test_snapshot_store.py
          uvx ruff==0.15.5 format --check scripts/snapshot_store.py tests/test_snapshot_store.py
      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- scripts/snapshot_store.py tests/test_snapshot_store.py; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/snapshot_store.py tests/test_snapshot_store.py
          git commit -m "style: apply Ruff to snapshot hotfix"
          git push origin HEAD:fix/snapshot-store-registry-fragments
