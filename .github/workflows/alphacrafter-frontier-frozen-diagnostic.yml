name: AlphaCrafter frozen frontier diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  execute-frozen-256:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: k4fka/investor2-jquants-free-cache
      HF_HOME: /tmp/huggingface-personal-cache
      PYTHONPATH: .
      FROZEN_AS_OF: "2026-08-23"
      EXPECTED_SOURCE_START: "2024-05-31"
      EXPECTED_SOURCE_END: "2026-05-29"
      EXPECTED_TEST_START: "2025-11-30"
      EXPECTED_TEST_END: "2026-05-29"
      EXPECTED_UNIVERSE_CUTOFF: "2025-08-30"
      EXPECTED_MASTER_DATE: "2025-08-29"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require owner cache credentials
        run: |
          test -n "$JQUANTS_API_KEY"
          test -n "$HF_TOKEN"
      - name: Install execution dependencies
        run: |
          python -m pip install jquants-api-client huggingface-hub cryptography numpy pandas pyarrow pydantic requests pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify frozen implementation contract
        run: |
          python -m py_compile \
            src/research/tradability.py \
            scripts/alphazerobeta_japan_tradable_prepare.py \
            scripts/alphazerobeta_japan_tradable_train.py \
            scripts/alphacrafter_jquants_tradable_frontier.py
          pytest -q tests/test_tradability.py tests/test_alphacrafter_frontier.py
      - name: Materialize frozen private J-Quants window
        run: |
          rm -rf /tmp/jquants-free /tmp/alphazerobeta-japan /tmp/huggingface-personal-cache
          python scripts/jquants_private_hf_cache.py \
            --output-dir /tmp/jquants-free \
            --hf-repo-id "$HF_DATASET_REPO" \
            --as-of "$FROZEN_AS_OF" \
            --request-interval 15 \
            --require-cache-complete
      - name: Resolve and assert frozen dates
        run: |
          ROOT=/tmp/jquants-free
          ROOT="$ROOT" python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path
          import pandas as pd

          root = Path(os.environ['ROOT'])
          manifest = json.loads((root / 'manifest.json').read_text())
          actual = manifest['actual_date_range']
          assert actual['start'] == os.environ['EXPECTED_SOURCE_START'], actual
          assert actual['end'] == os.environ['EXPECTED_SOURCE_END'], actual
          test_end = pd.Timestamp(actual['end'])
          test_start = test_end - pd.DateOffset(months=6) + pd.Timedelta(days=1)
          universe_cutoff = test_start - pd.DateOffset(months=3)
          benchmark = pd.read_parquet(root / 'benchmark.parquet')
          dates = pd.to_datetime(benchmark['Date'], errors='raise').dt.tz_localize(None)
          eligible = dates[dates <= universe_cutoff]
          if eligible.empty:
              raise SystemExit('no benchmark date on/before universe cutoff')
          master_date = eligible.max()
          assert str(test_start.date()) == os.environ['EXPECTED_TEST_START']
          assert str(test_end.date()) == os.environ['EXPECTED_TEST_END']
          assert str(universe_cutoff.date()) == os.environ['EXPECTED_UNIVERSE_CUTOFF']
          assert str(master_date.date()) == os.environ['EXPECTED_MASTER_DATE']
          print(f"SNAPSHOT_ROOT={root}")
          print(f"TEST_START={test_start.date()}")
          print(f"TEST_END={test_end.date()}")
          print(f"UNIVERSE_CUTOFF={universe_cutoff.date()}")
          print(f"UNIVERSE_MASTER_DATE={master_date.date()}")
          PY
      - name: Materialize frozen cutoff PIT master
        run: |
          sleep 15
          python scripts/jquants_pit_master_ephemeral.py \
            --date "$UNIVERSE_MASTER_DATE" \
            --output "$SNAPSHOT_ROOT/universe.parquet" \
            --request-interval 15
      - name: Prepare cutoff-fixed 256 panel with tradability mask
        run: |
          mkdir -p /tmp/alphazerobeta-japan
          python scripts/alphazerobeta_japan_tradable_prepare.py \
            --market-snapshot-dir "$SNAPSHOT_ROOT" \
            --market-regions jp \
            --output /tmp/alphazerobeta-japan/panel.npz \
            --max-assets 256 \
            --universe-cutoff "$UNIVERSE_CUTOFF"
      - name: Verify frozen sparse panel
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path('/tmp/alphazerobeta-japan/panel.npz.manifest.json').read_text())
          assert manifest['shape']['N'] == 256
          assert manifest['date_end'] == os.environ['EXPECTED_TEST_END']
          assert manifest['universe_cutoff'] == os.environ['EXPECTED_UNIVERSE_CUTOFF']
          assert manifest['selection_rule'].endswith('no future-survivor filter')
          assert manifest['tradability']['incomplete_market_days'] > 0
          print(json.dumps({'shape': manifest['shape'], 'date_start': manifest['date_start'], 'date_end': manifest['date_end'], 'tradability': manifest['tradability']}, indent=2, sort_keys=True))
          PY
      - name: Execute AlphaCrafter frozen representative
        run: |
          python scripts/alphacrafter_jquants_tradable_frontier.py \
            --dataset /tmp/alphazerobeta-japan/panel.npz \
            --dataset-manifest /tmp/alphazerobeta-japan/panel.npz.manifest.json \
            --output /tmp/alphazerobeta-japan/alphacrafter-result.json \
            --test-start "$TEST_START" \
            --test-end "$TEST_END" \
            --transaction-cost-bps 15 \
            --borrow-fee-bps 30
      - name: Execute AlphaZeroBeta frozen reference
        shell: bash
        run: |
          set -euo pipefail
          for fold in 0 1; do
            seed=$((2306 + fold))
            for corr in 0.5 0; do
              if [ "$corr" = "0.5" ]; then kind=primary; else kind=ablation; fi
              python scripts/alphazerobeta_japan_tradable_train.py \
                --dataset /tmp/alphazerobeta-japan/panel.npz \
                --output "/tmp/alphazerobeta-japan/${kind}-fold${fold}.json" \
                --test-start "$TEST_START" --test-end "$TEST_END" --fold-index "$fold" \
                --device cpu --seed "$seed" --iterations 10 --horizon 200 \
                --hidden-size 512 --agent-window 100 \
                --transaction-cost-bps 15 --borrow-fee-bps 30 \
                --lambda-corr "$corr" --lambda-turnover 0.001 --reward-semantics paper
            done
          done
      - name: Compare AlphaZeroBeta frozen OOS evidence
        run: |
          python scripts/alphazerobeta_compare.py \
            --dataset /tmp/alphazerobeta-japan/panel.npz \
            --primary-weights /tmp/alphazerobeta-japan/primary-fold0.weights.npz /tmp/alphazerobeta-japan/primary-fold1.weights.npz \
            --ablation-weights /tmp/alphazerobeta-japan/ablation-fold0.weights.npz /tmp/alphazerobeta-japan/ablation-fold1.weights.npz \
            --output /tmp/alphazerobeta-japan/comparison.json \
            --transaction-cost-bps 15 --borrow-fee-bps 30
      - name: Verify frozen matched diagnostic contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path('/tmp/alphazerobeta-japan')
          manifest = json.loads((root / 'panel.npz.manifest.json').read_text())
          azb = json.loads((root / 'comparison.json').read_text())
          alpha = json.loads((root / 'alphacrafter-result.json').read_text())
          checks = {
              'asset_count_256': alpha['shared_contract']['asset_count'] == 256 == len(manifest['selected_codes']),
              'selected_codes': alpha['shared_contract']['selected_codes'] == manifest['selected_codes'],
              'source_end': alpha['shared_contract']['date_end'] == os.environ['EXPECTED_TEST_END'],
              'universe_cutoff': alpha['shared_contract']['universe_cutoff'] == os.environ['EXPECTED_UNIVERSE_CUTOFF'],
              'transaction_cost': alpha['shared_contract']['transaction_cost_bps_per_side'] == azb['cost_assumptions']['transaction_cost_bps_per_side'] == 15,
              'borrow_fee': alpha['shared_contract']['borrow_fee_bps_per_year'] == azb['cost_assumptions']['borrow_fee_bps_per_year'] == 30,
              'folds': alpha['shared_contract']['walk_forward']['used_fold_indices'] == [0, 1],
              'observations': alpha['aggregate_oos_metrics']['observations'] == azb['primary_lambda_corr_0_5']['observations'],
              'tradability_recorded': manifest['tradability']['incomplete_market_days'] > 0,
          }
          summary = {
              'contract_status': 'MATCHED_DIAGNOSTIC' if all(checks.values()) else 'MISMATCH',
              'checks': checks,
              'source_window': [os.environ['EXPECTED_SOURCE_START'], os.environ['EXPECTED_SOURCE_END']],
              'alphazerobeta_reference': azb['primary_lambda_corr_0_5'],
              'alphacrafter': alpha['aggregate_oos_metrics'],
              'paper_family_verdict': 'BLOCKED',
              'blocker': 'No pre-existing frozen AAARTS 256 trading representative is present in the repository; AlphaZeroBeta is a paper-family reference, not AAARTS.',
          }
          (root / 'matched-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          if not all(checks.values()):
              raise SystemExit(f'frozen matched diagnostic failed: {checks}')
          PY
      - name: Upload frozen derived evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphacrafter-frozen-frontier-diagnostic
          if-no-files-found: warn
          path: |
            /tmp/alphazerobeta-japan/panel.npz.manifest.json
            /tmp/alphazerobeta-japan/alphacrafter-result.json
            /tmp/alphazerobeta-japan/primary-fold*.json
            /tmp/alphazerobeta-japan/ablation-fold*.json
            /tmp/alphazerobeta-japan/comparison.json
            /tmp/alphazerobeta-japan/matched-summary.json
