name: Input ledger integrity

on:
  pull_request:
    paths:
      - "data/input_ledger/**"
      - "data/market_snapshots/**"
      - "docs/research/data/**"
      - "scripts/audit_input_ledger.py"
      - "scripts/snapshot_store.py"
      - "tests/test_snapshot_store.py"
      - "docs/specs/external_snapshot_store.md"
      - ".github/workflows/input-ledger-integrity.yml"
  push:
    branches: [main]
    paths:
      - "data/input_ledger/**"
      - "data/market_snapshots/**"
      - "docs/research/data/**"
      - "scripts/audit_input_ledger.py"
      - "scripts/snapshot_store.py"
      - "tests/test_snapshot_store.py"
      - "docs/specs/external_snapshot_store.md"
      - ".github/workflows/input-ledger-integrity.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Deterministic external-input audit
        run: python scripts/audit_input_ledger.py
      - name: Reusable snapshot catalog audit
        run: python scripts/snapshot_store.py audit
