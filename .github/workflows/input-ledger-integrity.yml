name: Input ledger integrity

on:
  pull_request:
    paths:
      - "data/input_ledger/**"
      - "data/market_snapshots/**"
      - "scripts/audit_input_ledger.py"
      - ".github/workflows/input-ledger-integrity.yml"
  push:
    branches: [main]
    paths:
      - "data/input_ledger/**"
      - "data/market_snapshots/**"
      - "scripts/audit_input_ledger.py"
      - ".github/workflows/input-ledger-integrity.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deterministic external-input audit
        run: python scripts/audit_input_ledger.py
