name: allocation Ruff format diff

on:
  push:
    branches:
      - research/skfolio-allocation-oos
    paths:
      - "scripts/skfolio_allocation_oos.py"
      - ".github/workflows/ruff-format-diff.yml"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - run: uv sync --locked
      - name: Show canonical Ruff formatting diff
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format scripts/skfolio_allocation_oos.py
          git --no-pager diff -- scripts/skfolio_allocation_oos.py
