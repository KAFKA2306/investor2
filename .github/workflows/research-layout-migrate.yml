name: Apply research layout migration

on:
  push:
    branches: [issue-194-research-layout]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-194-research-layout
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Move research artifacts by responsibility
        run: |
          mkdir -p docs/research/catalogs docs/research/frontier docs/research/studies

          git mv docs/research/2010s_paper_catalog.json docs/research/catalogs/2010s_paper_catalog.json
          git mv docs/research/2010s_paper_catalog.md docs/research/catalogs/2010s_paper_catalog.md
