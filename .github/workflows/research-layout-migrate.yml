              "tests/test_session_state_oos.py": "tests/test_daily_market_session_oos.py",
              ".github/workflows/alphazerobeta-market-snapshot.yml": ".github/workflows/market-snapshot-daily-session.yml",
              "scripts.session_state_baseline": "scripts.daily_market_session_baseline",
              "scripts.session_state_oos": "scripts.daily_market_session_oos",
              "src.research.session_state": "src.research.daily_market_session_features",
              "investor2.session-state-oos.v1": "investor2.daily-market-session-oos.v1",
              "investor2.session-state-baseline.v1": "investor2.daily-market-session-baseline.v1",
          }

          excluded = {".github/workflows/research-layout-migrate.yml"}
          changed = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              relative = path.as_posix().removeprefix("./")
              if relative in excluded:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              updated = updated.replace("# Issue #161 — session-state research protocol", "# Issue #161 — daily market session research protocol")
              updated = updated.replace("assumptions in the session-state code", "assumptions in the daily-market-session code")
              updated = updated.replace("One generic session-state implementation", "One generic daily-market-session implementation")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(relative)

          Path("docs/research/README.md").write_text("""# Research evidence

`docs/research/` stores durable research evidence. Chat history, agent reasoning, and temporary implementation notes are not repository state.

## Directory contract

- `catalogs/` — paper registries, selection manifests, schemas, and version pins used to define research scope.
- `contracts/` — frozen experiment, data, split, and decision contracts fixed before evaluation.
- `data/` — small versioned research inputs and source snapshots that belong with the research evidence surface.
- `data_access/` — data-access documentation and acquisition boundaries.
- `frontier/` — canonical machine-readable paper/factor frontier registries used to generate public comparison views.
- `protocols/` — preregistered research protocols and evaluation procedures.
- `results/` — canonical summaries and validated result artifacts; detailed result bundles may use subdirectories.
- `runs/` — immutable run-level evidence bundles.
- `studies/` — standalone company, macro, and hypothesis studies that are neither contracts nor canonical result registries.
- `assets/` — figures and other supporting assets referenced by research documents.

The root of `docs/research/` contains only this `README.md`. New evidence must be placed by responsibility rather than dropped into the root.

## State discipline

A path should reveal the role of an artifact without opening it. File names must identify the subject or contract explicitly; generic names such as `final`, `latest`, `result`, `analysis`, or ambiguous domain names are not canonical identities.

Machine-readable artifacts are authoritative where a workflow declares them canonical. Markdown summaries and public views must point to those artifacts rather than becoming independent state stores.

When a workline cannot finish, durable continuation belongs in the existing Issue/PR and versioned evidence artifacts. Do not depend on chat memory to reconstruct research state.
""", encoding="utf-8")

          layout_test = '''from __future__ import annotations

import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
RESEARCH = ROOT / "docs" / "research"
EXPECTED_DIRECTORIES = {"assets", "catalogs", "contracts", "data", "data_access", "frontier", "protocols", "results", "runs", "studies"}
FORBIDDEN_PATHS = {
    "docs/research/paper_family_frontier.json",
    "docs/research/paper_factor_registry.json",
    "docs/research/session_state_161_preregistration.md",
    "docs/research/session_state_161_evidence_plan.md",
    "src/research/session_state.py",
    "scripts/session_state_baseline.py",
    "scripts/session_state_oos.py",
    "tests/test_session_state.py",
    "tests/test_session_state_baseline.py",
    "tests/test_session_state_oos.py",
    ".github/workflows/alphazerobeta-market-snapshot.yml",
}
FORBIDDEN_REFERENCES = {
    "docs/research/paper_family_frontier.json",
    "docs/research/paper_factor_registry.json",
    "src.research.session_state",
    "scripts.session_state_baseline",
    "scripts.session_state_oos",
    "investor2.session-state-oos.v1",
    "investor2.session-state-baseline.v1",
}

class ResearchLayoutTest(unittest.TestCase):
    def test_research_root_contains_only_navigation(self) -> None:
        self.assertEqual({p.name for p in RESEARCH.iterdir() if p.is_file()}, {"README.md"})

    def test_research_role_directories_are_explicit(self) -> None:
        self.assertLessEqual(EXPECTED_DIRECTORIES, {p.name for p in RESEARCH.iterdir() if p.is_dir()})

    def test_superseded_paths_do_not_return(self) -> None:
        existing = sorted(path for path in FORBIDDEN_PATHS if (ROOT / path).exists())
        self.assertFalse(existing, f"superseded paths returned: {existing}")

    def test_ambiguous_references_do_not_return(self) -> None:
        stale = []
        for path in ROOT.rglob("*"):
            if not path.is_file() or ".git" in path.parts:
                continue
            relative = path.relative_to(ROOT).as_posix()
            if relative == "tests/test_research_layout.py":
                continue
            try:
                text = path.read_text(encoding="utf-8")
            except (UnicodeDecodeError, OSError):
                continue
            for old in FORBIDDEN_REFERENCES:
                if old in text:
                    stale.append(f"{relative}: {old}")
        self.assertFalse(stale, "stale research references remain:\n" + "\n".join(sorted(stale)))

if __name__ == "__main__":
    unittest.main()
'''
          Path("tests/test_research_layout.py").write_text(layout_test, encoding="utf-8")

          wf = Path(".github/workflows/paper-family-frontier.yml")
          workflow = wf.read_text(encoding="utf-8")
          old = """      - name: Prove duplicate, mismatch, alias, coverage, and README gates\n        run: python -m unittest discover -s tests -p 'test_paper_family_frontier.py'\n      - name: Compile validator\n        run: python -m py_compile scripts/paper_family_frontier.py tests/test_paper_family_frontier.py\n"""
          new = """      - name: Prove family identity and research layout gates\n        run: |\n          python -m unittest discover -s tests -p 'test_paper_family_frontier.py'\n          python -m unittest discover -s tests -p 'test_research_layout.py'\n      - name: Compile validators\n        run: python -m py_compile scripts/paper_family_frontier.py tests/test_paper_family_frontier.py tests/test_research_layout.py\n"""
          if old not in workflow:
              raise SystemExit("paper-family workflow contract changed unexpectedly")
          wf.write_text(workflow.replace(old, new), encoding="utf-8")

          print(f"updated {len(changed)} text consumers")
          PY

          rm .github/workflows/research-layout-migrate.yml
