name: Quality Gates

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "package.json"
      - "bun.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "config/biome.json"
      - "prek.toml"
      - "Taskfile.yml"
      - ".github/workflows/quality.yml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "package.json"
      - "bun.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "config/biome.json"
      - "prek.toml"
      - "Taskfile.yml"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript / Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"
      - name: Install locked dependencies
        run: bun ci
      - name: Check formatting and imports
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test

  python:
    name: Python / uv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Install quality dependencies only
        run: uv sync --locked --only-group dev
      - name: Check formatting
        run: uv run --no-sync ruff format --check src scripts tests
      - name: Lint
        run: uv run --no-sync ruff check src scripts tests
      - name: Type check
        run: uv run --no-sync pyrefly check
