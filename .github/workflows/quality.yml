name: Quality Gates

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "package.json"
      - "bun.lock"
      - "pyproject.toml"
      - "uv.lock"
      - ".oxlintrc.json"
      - "config/biome.json"
      - "prek.toml"
      - "Taskfile.yml"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Locked quality ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Verify lockfiles
        run: |
          bun ci
          uv lock --check
          uv sync --locked --only-group dev
      - name: Changed-file format and lint ratchet
        run: bun run quality:changed
      - name: TypeScript strict check
        run: bun run typecheck
      - name: Pyrefly strict check with migration baseline
        run: uv run --no-sync pyrefly check
      - name: TypeScript unit tests
        run: bun run test
