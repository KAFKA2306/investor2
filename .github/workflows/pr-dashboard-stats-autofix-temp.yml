name: Temporary dashboard stats refactor

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"
      - name: Apply fail-closed dashboard stats path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/dashboard/server.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'import { existsSync, readFileSync } from "node:fs";',
              'import { readFileSync } from "node:fs";',
          )
          text = text.replace(
              'import { ConfigSchema } from "../shared/schema";',
              'import {\n  parseCacheStatisticsProcessResult,\n  type CacheStatistics,\n} from "../shared/cache_statistics";\nimport { ConfigSchema } from "../shared/schema";',
          )

          start = text.index("interface CacheStatistics {")
          end = text.index("// Render stats as HTML")
          replacement = '''let cachedStats: CacheStatistics | null = null;
          let lastStatsUpdate = 0;
          const STATS_CACHE_TTL = 30_000;

          function formatBytes(bytes: number): string {
            if (bytes === 0) return "0 B";
            const k = 1024;
            const sizes = ["B", "KB", "MB", "GB", "TB"];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / k ** i).toFixed(2))} ${sizes[i]}`;
          }

          function renderStatsUnavailable(): string {
            return `
              <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6" role="alert">
                <div class="text-red-700 font-medium">統計情報を取得できません</div>
                <div class="text-sm text-red-600 mt-1">データソースまたは統計処理を確認してください。未取得値を 0 として表示しません。</div>
              </div>
            `;
          }

          async function getStats(): Promise<CacheStatistics> {
            const now = Date.now();
            if (cachedStats && now - lastStatsUpdate < STATS_CACHE_TTL) {
              return cachedStats;
            }

            const proc = Bun.spawn(["bun", "run", "src/tasks/stats.ts", "--json"], {
              cwd: process.cwd(),
              stdin: "ignore",
              stdout: "pipe",
              stderr: "pipe",
            });
            const [output, stderr, exitCode] = await Promise.all([
              new Response(proc.stdout).text(),
              new Response(proc.stderr).text(),
              proc.exited,
            ]);
            if (stderr.trim()) {
              console.error(stderr.trim());
            }

            const stats = parseCacheStatisticsProcessResult(output, exitCode);
            cachedStats = stats;
            lastStatsUpdate = now;
            return stats;
          }

          '''
          text = text[:start] + replacement + text[end:]

          old_root = '''app.get("/", async (c) => {
            const stats = await getStats();
            return c.html(`'''
          new_root = '''app.get("/", async (c) => {
            let statsHtml: string;
            try {
              statsHtml = renderStatsCards(await getStats());
            } catch (error) {
              console.error("Failed to get stats:", error);
              statsHtml = renderStatsUnavailable();
            }
            return c.html(`'''
          if old_root not in text:
              raise SystemExit("root stats route pattern not found")
          text = text.replace(old_root, new_root, 1)

          old_root_body = '''          <div id="stats" hx-trigger="load" hx-get="/api/stats" hx-swap="innerHTML">
                    ${renderStatsCards(stats)}
                  </div>'''
          new_root_body = '''          <div id="stats" hx-trigger="load" hx-get="/api/stats" hx-swap="innerHTML">
                    ${statsHtml}
                  </div>'''
          if old_root_body not in text:
              raise SystemExit("root stats body pattern not found")
          text = text.replace(old_root_body, new_root_body, 1)

          old_api = '''app.get("/api/stats", async (c) => {
            const stats = await getStats();
            return c.html(renderStatsCards(stats));
          });'''
          new_api = '''app.get("/api/stats", async (c) => {
            try {
              return c.html(renderStatsCards(await getStats()));
            } catch (error) {
              console.error("Failed to get stats:", error);
              return c.html(renderStatsUnavailable(), 503);
            }
          });'''
          if old_api not in text:
              raise SystemExit("api stats route pattern not found")
          text = text.replace(old_api, new_api, 1)

          forbidden = [
              "JSON_CACHE_PATH",
              "JSON_CACHE_TTL",
              "const parseNumber =",
              "const parseFloat_ =",
              'lastUpdated: "Error"',
          ]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f"forbidden legacy stats marker remains: {marker}")

          path.write_text(text, encoding="utf-8")
          PY
      - name: Format and validate focused changes
        run: |
          bun ci
          bun x biome format --write --config-path=config/biome.json \
            src/dashboard/server.ts \
            src/tasks/stats.ts \
            src/shared/cache_statistics.ts \
            tests/dashboard_stats_contract.test.ts
          bun test tests/dashboard_stats_contract.test.ts
          bun run typecheck
      - name: Commit refactor
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/server.ts src/tasks/stats.ts src/shared/cache_statistics.ts tests/dashboard_stats_contract.test.ts
          git commit -m "fix: fail closed on unavailable dashboard stats"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
