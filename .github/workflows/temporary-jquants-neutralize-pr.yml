name: Temporary J-Quants neutralization PR runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python scripts/temporary_jquants_neutralize.py
      - name: Format and validate
        run: |
          python -m pip install ruff pytest numpy pandas pyarrow pydantic requests
          ruff format scripts/jquants_free_ephemeral.py scripts/jquants_private_hf_cache.py scripts/jquants_pit_master_ephemeral.py scripts/jquants_japan_panel.py scripts/alphazerobeta_prepare.py tests/test_jquants_strategy_neutrality.py
          ruff check --fix scripts/jquants_free_ephemeral.py scripts/jquants_private_hf_cache.py scripts/jquants_pit_master_ephemeral.py scripts/jquants_japan_panel.py scripts/alphazerobeta_prepare.py tests/test_jquants_strategy_neutrality.py
          python -m py_compile scripts/jquants_free_ephemeral.py scripts/jquants_private_hf_cache.py scripts/jquants_pit_master_ephemeral.py scripts/jquants_japan_panel.py scripts/alphazerobeta_prepare.py
          pytest -q tests/test_jquants_strategy_neutrality.py
          if git grep -n -E 'alphazerobeta_jquants_(free_ephemeral|private_hf_cache|pit_master_ephemeral)|alphazerobeta_japan_free_prepare' -- ':!docs/research/results/**'; then
            echo 'legacy shared entry-point reference remains' >&2
            exit 1
          fi
          ! grep -qi alphacrafter .github/workflows/alphazerobeta-jquants-free-validation.yml
      - name: Commit completed migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: make J-Quants frontier strategy-neutral'
          git push origin HEAD:${{ github.head_ref }}
