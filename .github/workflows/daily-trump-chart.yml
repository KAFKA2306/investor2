name: Build Trump OGE 278-T daily chart

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  pull_request:
    paths:
      - "scripts/daily_trump_chart.py"
      - "tests/test_daily_trump_chart.py"
      - ".github/workflows/daily-trump-chart.yml"
  push:
    branches: [main]
    paths:
      - "scripts/daily_trump_chart.py"
      - "tests/test_daily_trump_chart.py"
      - ".github/workflows/daily-trump-chart.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check matplotlib pytest
      - run: python -m pytest -q tests/test_daily_trump_chart.py
      - run: python scripts/daily_trump_chart.py
      - name: Verify output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("generated/trump-daily-chart")
          summary = json.loads((out / "summary.json").read_text())
          rows = summary["daily"]
          assert rows
          assert all(r["Total"] == r["Purchase"] + r["Sale"] for r in rows)
          assert sum(r["Total"] for r in rows) == summary["row_count"]
          assert {p.name for p in out.iterdir()} == {"summary.json", "trump_daily_transactions.png"}
          assert (out / "trump_daily_transactions.png").stat().st_size > 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trump-daily-chart-${{ github.sha }}
          path: generated/trump-daily-chart
          if-no-files-found: error
          retention-days: 30
      - name: Commit changed snapshot
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- generated/trump-daily-chart && [ -z "$(git status --porcelain --untracked-files=all generated/trump-daily-chart)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/trump-daily-chart
          git commit -m "data: refresh Trump 278-T daily chart"
          git push
