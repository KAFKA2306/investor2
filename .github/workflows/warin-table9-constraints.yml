name: Execute Warin Table 9 constrained comparison

on:
  pull_request:
    paths:
      - "docs/research/protocols/warin_2101_02044_v4_table9_beta0959.json"
      - "scripts/run_warin_2101_02044_table9_constraints.py"
      - ".github/workflows/warin-table9-constraints.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warin-table9-constraints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Detect immutable evidence already committed
        id: evidence
        shell: bash
        run: |
          root=docs/research/runs/warin_2101_02044_v4_table9_beta0959_seed2306
          if test -f "$root/summary.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install locked runtime
        if: steps.evidence.outputs.present != 'true'
        run: python -m pip install --disable-pip-version-check "tensorflow==2.21.0" "numpy<2.4"

      - name: Compile runner
        run: python -m py_compile scripts/run_warin_2101_02044_table9_constraints.py

      - name: Execute predeclared constrained comparison
        if: steps.evidence.outputs.present != 'true'
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          TF_DETERMINISTIC_OPS: "1"
        run: |
          rm -rf docs/research/runs/warin_2101_02044_v4_table9_beta0959_seed2306
          python scripts/run_warin_2101_02044_table9_constraints.py \
            --protocol docs/research/protocols/warin_2101_02044_v4_table9_beta0959.json \
            --output-root docs/research/runs/warin_2101_02044_v4_table9_beta0959_seed2306

      - name: Commit immutable evidence to PR branch
        if: github.event_name == 'pull_request' && steps.evidence.outputs.present != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/runs/warin_2101_02044_v4_table9_beta0959_seed2306
          git diff --cached --quiet && exit 0
          git commit -m "research: materialize Warin Table 9 constrained evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: warin-table9-constraints
          path: docs/research/runs/warin_2101_02044_v4_table9_beta0959_seed2306
          if-no-files-found: error
