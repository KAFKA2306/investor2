name: Execute Warin Table 9 constrained comparison

on:
  pull_request:
    paths:
      - "docs/research/protocols/warin_2101_02044_v4_table9_beta0959.json"
      - "scripts/run_warin_2101_02044_table9_constraints.py"
      - "scripts/run_warin_2101_02044_table9_single.py"
      - "scripts/aggregate_warin_2101_02044_table9.py"
      - ".github/workflows/warin-table9-constraints.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warin-table9-constraints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        model: [1, 4]
        restart: [0, 1, 2, 3]
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install locked runtime
        run: python -m pip install --disable-pip-version-check "tensorflow==2.21.0" "numpy<2.4"

      - name: Compile runners
        run: |
          python -m py_compile scripts/run_warin_2101_02044_table9_constraints.py
          python -m py_compile scripts/run_warin_2101_02044_table9_single.py

      - name: Execute one predeclared restart
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          TF_DETERMINISTIC_OPS: "1"
        run: |
          out=/tmp/warin-table9-model${{ matrix.model }}-restart${{ matrix.restart }}
          rm -rf "$out"
          python scripts/run_warin_2101_02044_table9_single.py \
            --protocol docs/research/protocols/warin_2101_02044_v4_table9_beta0959.json \
            --model-id ${{ matrix.model }} \
            --restart ${{ matrix.restart }} \
            --output-dir "$out"

      - name: Upload restart evidence
        uses: actions/upload-artifact@v7
        with:
          name: warin-table9-model${{ matrix.model }}-restart${{ matrix.restart }}
          path: /tmp/warin-table9-model${{ matrix.model }}-restart${{ matrix.restart }}
          if-no-files-found: error

  aggregate:
    needs: reproduce
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download restart evidence
        uses: actions/download-artifact@v8
        with:
          pattern: warin-table9-model*-restart*
          path: /tmp/warin-table9-downloads

      - name: Aggregate and hash evidence
        run: |
          rm -rf docs/research/runs/warin_2101_02044_v4_table9_beta0959_seed2306
          python scripts/aggregate_warin_2101_02044_table9.py \
            --protocol docs/research/protocols/warin_2101_02044_v4_table9_beta0959.json \
            --downloads /tmp/warin-table9-downloads \
            --output-root docs/research/runs/warin_2101_02044_v4_table9_beta0959_seed2306

      - name: Upload combined evidence
        uses: actions/upload-artifact@v7
        with:
          name: warin-table9-constraints
          path: docs/research/runs/warin_2101_02044_v4_table9_beta0959_seed2306
          if-no-files-found: error

      - name: Verify generated evidence matches committed evidence
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import math
          import pathlib
          import struct
          import subprocess

          root = pathlib.Path("docs/research/runs/warin_2101_02044_v4_table9_beta0959_seed2306")
          max_float32_ulps = 16
          aggregate_abs_tolerance = 1e-5
          aggregate_rel_tolerance = 1e-5
          run_local_keys = {
              "github_sha",
              "model_state_sha256",
              "training_trace_sha256",
              "report_sha256",
          }

          def sha256(payload):
              return hashlib.sha256(payload).hexdigest()

          def committed_bytes(path):
              return subprocess.check_output(["git", "show", f"HEAD:{path}"])

          def generated_bytes(path):
              return path.read_bytes()

          def strip_run_local(value):
              if isinstance(value, dict):
                  return {
                      key: strip_run_local(item)
                      for key, item in value.items()
                      if key not in run_local_keys
                  }
              if isinstance(value, list):
                  return [strip_run_local(item) for item in value]
              return value

          def float32_ordered_bits(value):
              bits = struct.unpack(">I", struct.pack(">f", float(value)))[0]
              if bits & 0x80000000:
                  return 0x80000000 - (bits & 0x7FFFFFFF)
              return 0x80000000 + bits

          def float32_close(left, right):
              left = float(left)
              right = float(right)
              if not (math.isfinite(left) and math.isfinite(right)):
                  return left == right
              if left == right:
                  return True
              return abs(float32_ordered_bits(left) - float32_ordered_bits(right)) <= max_float32_ulps

          def first_difference(committed, generated, location="$", numeric_mode="aggregate"):
              if isinstance(committed, bool) or isinstance(generated, bool):
                  if committed is generated:
                      return None
                  return f"{location}: boolean differs ({committed!r} != {generated!r})"
              if isinstance(committed, (int, float)) and isinstance(generated, (int, float)):
                  left = float(committed)
                  right = float(generated)
                  if numeric_mode == "float32":
                      close = float32_close(left, right)
                  else:
                      close = math.isclose(
                          left,
                          right,
                          rel_tol=aggregate_rel_tolerance,
                          abs_tol=aggregate_abs_tolerance,
                      )
                  if close:
                      return None
                  absolute = abs(left - right)
                  scale = max(abs(left), abs(right))
                  relative = absolute / scale if scale else 0.0
                  detail = (
                      f"{location}: numeric differs; committed={left:.17g}, "
                      f"generated={right:.17g}, abs_diff={absolute:.17g}, "
                      f"rel_diff={relative:.17g}"
                  )
                  if numeric_mode == "float32" and math.isfinite(left) and math.isfinite(right):
                      ulps = abs(float32_ordered_bits(left) - float32_ordered_bits(right))
                      detail += f", float32_ulp_diff={ulps}"
                  return detail
              if type(committed) is not type(generated):
                  return (
                      f"{location}: type differs "
                      f"({type(committed).__name__} != {type(generated).__name__})"
                  )
              if isinstance(committed, dict):
                  if committed.keys() != generated.keys():
                      return f"{location}: object keys differ"
                  for key in committed:
                      child_mode = numeric_mode
                      if key == "learning_rate":
                          child_mode = "aggregate"
                      difference = first_difference(
                          committed[key], generated[key], f"{location}.{key}", child_mode
                      )
                      if difference:
                          return difference
                  return None
              if isinstance(committed, list):
                  if len(committed) != len(generated):
                      return (
                          f"{location}: list length differs "
                          f"({len(committed)} != {len(generated)})"
                      )
                  for index, (left, right) in enumerate(
                      zip(committed, generated, strict=True)
                  ):
                      difference = first_difference(
                          left, right, f"{location}[{index}]", numeric_mode
                      )
                      if difference:
                          return difference
                  return None
              if committed != generated:
                  return f"{location}: value differs ({committed!r} != {generated!r})"
              return None

          def verify_internal_hashes(reader, label):
              summary_path = root / "summary.json"
              summary = json.loads(reader(summary_path))
              for model in (1, 4):
                  for restart in range(4):
                      run_dir = root / f"model{model}" / f"restart{restart}"
                      report_path = run_dir / "report.json"
                      trace_path = run_dir / "training_trace.json"
                      state_path = run_dir / "model_state.json"
                      report_bytes = reader(report_path)
                      trace_bytes = reader(trace_path)
                      state_bytes = reader(state_path)
                      report = json.loads(report_bytes)
                      if report["training"]["training_trace_sha256"] != sha256(trace_bytes):
                          raise SystemExit(f"{label} trace hash mismatch: {trace_path}")
                      if report["training"]["model_state_sha256"] != sha256(state_bytes):
                          raise SystemExit(f"{label} model-state hash mismatch: {state_path}")
                      hashes = summary["artifact_hashes"][f"model{model}_restart{restart}"]
                      expected = {
                          "report_sha256": sha256(report_bytes),
                          "training_trace_sha256": sha256(trace_bytes),
                          "model_state_sha256": sha256(state_bytes),
                      }
                      if hashes != expected:
                          raise SystemExit(
                              f"{label} summary artifact hash mismatch: model{model} restart{restart}"
                          )

          generated_paths = sorted(path for path in root.rglob("*") if path.is_file())
          committed_paths = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", "HEAD", "--", str(root)],
              text=True,
          ).splitlines()
          if [str(path) for path in generated_paths] != committed_paths:
              raise SystemExit("generated and committed Table 9 evidence file sets differ")

          verify_internal_hashes(committed_bytes, "committed")
          verify_internal_hashes(generated_bytes, "generated")

          for path in generated_paths:
              committed_obj = strip_run_local(json.loads(committed_bytes(path)))
              generated_obj = strip_run_local(json.loads(generated_bytes(path)))
              if path.name in {"model_state.json", "training_trace.json"}:
                  numeric_mode = "float32"
              else:
                  numeric_mode = "aggregate"
              difference = first_difference(
                  committed_obj, generated_obj, numeric_mode=numeric_mode
              )
              if difference:
                  raise SystemExit(
                      f"Table 9 semantic evidence differs: {path}; {difference}"
                  )
          PY
