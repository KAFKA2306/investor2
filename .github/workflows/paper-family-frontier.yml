name: Paper family frontier contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate canonical family registry
        run: python scripts/paper_family_frontier.py validate
      - name: Verify generated comparison surfaces
        run: |
          python scripts/paper_family_frontier.py render --check
          python scripts/paper_family_frontier.py readme --check
      - name: Prove family identity and research layout gates
        run: |
          python -m unittest discover -s tests -p 'test_paper_family_frontier.py'
          python -m unittest discover -s tests -p 'test_research_layout.py'
      - name: Compile validators
        run: python -m py_compile scripts/paper_family_frontier.py tests/test_paper_family_frontier.py tests/test_research_layout.py
