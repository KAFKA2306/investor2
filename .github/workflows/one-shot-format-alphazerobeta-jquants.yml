name: One-shot format AlphaZeroBeta J-Quants

on:
  push:
    branches:
      - research/alphazerobeta-jquants-free-validation-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/alphazerobeta-jquants-free-validation-v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Format and fix imports
        run: |
          python -m pip install ruff
          ruff format \
            scripts/alphazerobeta_jquants_free_collect.py \
            scripts/alphazerobeta_japan_free_train.py
          ruff check --fix \
            scripts/alphazerobeta_jquants_free_collect.py \
            scripts/alphazerobeta_japan_free_train.py
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/alphazerobeta_jquants_free_collect.py \
            scripts/alphazerobeta_japan_free_train.py
          if ! git diff --cached --quiet; then
            git commit -m "style: format J-Quants validation entry points"
            git push origin HEAD:research/alphazerobeta-jquants-free-validation-v2
          fi
