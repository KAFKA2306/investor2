name: Repository footprint once

on:
  push:
    paths:
      - ".github/workflows/repo-footprint-once.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Measure tracked repository footprint
        shell: python
        run: |
          import hashlib
          import subprocess
          from collections import Counter, defaultdict
          from pathlib import Path

          SELF = ".github/workflows/repo-footprint-once.yml"
          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [p.decode() for p in raw.split(b"\0") if p and p.decode() != SELF]

          dirs = set()
          text_lines = 0
          text_files = 0
          top_files = Counter()
          top_lines = Counter()
          hashes = defaultdict(list)

          for path in paths:
              parts = Path(path).parts
              top = parts[0] if len(parts) > 1 else "(root)"
              top_files[top] += 1
              for i in range(1, len(parts)):
                  dirs.add(str(Path(*parts[:i])))

              data = Path(path).read_bytes()
              hashes[hashlib.sha256(data).hexdigest()].append(path)
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              lines = text.count("\n") + (1 if text and not text.endswith("\n") else 0)
              text_files += 1
              text_lines += lines
              top_lines[top] += lines

          print(f"TRACKED_FILES={len(paths)}")
          print(f"TRACKED_FOLDERS={len(dirs)}")
          print(f"UTF8_TEXT_FILES={text_files}")
          print(f"UTF8_TEXT_LINES={text_lines}")
          print("TOP_LEVEL_BEGIN")
          for top, count in sorted(top_files.items(), key=lambda x: (-x[1], x[0])):
              print(f"TOP {top} files={count} lines={top_lines[top]}")
          print("TOP_LEVEL_END")

          groups = [v for v in hashes.values() if len(v) > 1]
          print(f"EXACT_DUP_GROUPS={len(groups)}")
          print(f"EXACT_DUP_EXTRA_FILES={sum(len(g) - 1 for g in groups)}")
          print("EXACT_DUP_BEGIN")
          for group in sorted(groups, key=lambda g: (-len(g), g)):
              print("DUP " + " | ".join(sorted(group)))
          print("EXACT_DUP_END")
