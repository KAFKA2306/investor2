name: Verify issue 10 and cleanup branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-issue-10-cleanup.yml

permissions:
  contents: write

jobs:
  verify-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest
      - name: Verify frozen industry split
        run: python -m pytest tests/test_industry_frozen_split.py -q
      - name: Delete merged work branches
        run: |
          set -euo pipefail
          for branch in agent/fix-industry-frozen-split ops/finalize-issue-10; do
            git push origin --delete "$branch" || true
          done
      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/verify-issue-10-cleanup.yml
          git commit -m 'chore: remove issue 10 verification workflow [skip ci]'
          git push origin HEAD:main
