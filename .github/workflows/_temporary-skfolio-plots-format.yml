name: Temporary skfolio plots formatter

on:
  push:
    branches:
      - research/skfolio-jquants-plots

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - run: uv sync --locked
      - name: Apply canonical Ruff formatting
        run: |
          uv run ruff format src/research/skfolio_plot_exports.py scripts/skfolio_jquants_plots.py tests/test_skfolio_plot_exports.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research/skfolio_plot_exports.py scripts/skfolio_jquants_plots.py tests/test_skfolio_plot_exports.py
          if ! git diff --cached --quiet; then
            git commit -m "style: format skfolio plot exporter"
            git push origin HEAD:research/skfolio-jquants-plots
          fi
