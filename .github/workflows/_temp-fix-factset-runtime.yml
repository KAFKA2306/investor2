name: Temporary normalize FactSet runtime quality

on:
  push:
    branches:
      - feat/factset-delivery-runtime
    paths:
      - ".github/workflows/_temp-fix-factset-runtime.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/factset-delivery-runtime
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Add strict override markers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/factset_insight_delivery.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from typing import Any\n', 'from typing import Any, override\n')
          for signature in (
              '    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n',
              '    def handle_endtag(self, tag: str) -> None:\n',
              '    def handle_data(self, data: str) -> None:\n',
          ):
              decorated = '    @override\n' + signature
              if decorated not in text:
                  text = text.replace(signature, decorated)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply repository-pinned Ruff
        run: |
          python -m pip install 'ruff==0.15.5'
          ruff check --fix scripts/factset_insight_delivery.py tests/test_factset_insight_delivery.py
          ruff format scripts/factset_insight_delivery.py tests/test_factset_insight_delivery.py
          ruff check scripts/factset_insight_delivery.py tests/test_factset_insight_delivery.py
          ruff format --check scripts/factset_insight_delivery.py tests/test_factset_insight_delivery.py
      - name: Commit normalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/factset_insight_delivery.py tests/test_factset_insight_delivery.py
          if git diff --cached --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git commit -m "style: normalize FactSet delivery runtime"
          git push origin HEAD:feat/factset-delivery-runtime
