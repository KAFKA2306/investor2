name: Dedupe ARK repository coverage once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dedupe-ark-coverage-once.yml"

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Keep only API projection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/build_ark_repository_coverage.py")
          text = path.read_text()
          replacements = {
              'DEFAULT_DATA_OUTPUT = DATA / "repository-coverage.json"\n': '',
              '    parser.add_argument("--data-output", type=Path, default=DEFAULT_DATA_OUTPUT)\n': '',
              '    write_json(args.data_output, result)\n': '',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match: {old!r}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm data/ark-big-ideas/repository-coverage.json
      - name: Verify focused contract
        run: |
          python -m pytest -q tests/test_ark_repository_coverage.py
          ! grep -Fq 'DEFAULT_DATA_OUTPUT' scripts/build_ark_repository_coverage.py
          ! grep -Fq -- '--data-output' scripts/build_ark_repository_coverage.py
          test -f api/v1/ark-big-ideas/repository-coverage.json
          test ! -e data/ark-big-ideas/repository-coverage.json
      - name: Commit deduplication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/build_ark_repository_coverage.py data/ark-big-ideas/repository-coverage.json
          git commit -m "refactor: keep one ARK coverage projection"
          git pull --rebase origin main
          git push origin HEAD:main
