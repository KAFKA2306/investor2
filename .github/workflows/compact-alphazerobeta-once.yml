name: Compact AlphaZeroBeta evidence once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compact-alphazerobeta-once.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compact generator, verification contract, and checked evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new)

          script_path = Path("scripts/alphazerobeta_empirical_run.py")
          text = script_path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '    return primary.with_suffix(".weights.npz"), ablation.with_suffix(".weights.npz")\n',
              '    primary_weight = primary.with_suffix(".weights.npz")\n'
              '    ablation_weight = ablation.with_suffix(".weights.npz")\n'
              '    primary.unlink()\n'
              '    ablation.unlink()\n'
              '    return primary_weight, ablation_weight\n',
              "drop transient fold reports",
          )
          text = replace_once(
              text,
              '    return output\n\n\ndef money(cumulative_return: float, initial: float) -> dict[str, float]:\n',
              '''    return output\n\n\ndef compact_comparisons(\n    output_dir: Path, comparison: Path, sensitivity: list[Path]\n) -> Path:\n    scenarios: dict[str, dict[str, Any]] = {}\n    for path in sensitivity:\n        payload = read_json(path)\n        assumptions = payload["cost_assumptions"]\n        trading = int(float(assumptions["transaction_cost_bps_per_side"]))\n        borrow = int(float(assumptions["borrow_fee_bps_per_year"]))\n        scenarios[f"{trading}bps_borrow_{borrow}bps"] = payload\n    default_scenario = f"{int(PRIMARY_TRANSACTION_COST_BPS)}bps_borrow_{int(PRIMARY_BORROW_FEE_BPS)}bps"\n    if read_json(comparison) != scenarios[default_scenario]:\n        raise AssertionError("default comparison must equal the matching sensitivity scenario")\n    output = output_dir / "cost_sensitivity.json"\n    write_json(\n        output,\n        {\n            "schema_version": "investor2.alphazerobeta-cost-sensitivity.v1",\n            "default_scenario": default_scenario,\n            "scenarios": scenarios,\n        },\n    )\n    for path in {comparison, *sensitivity}:\n        path.unlink()\n    return output\n\n\ndef money(cumulative_return: float, initial: float) -> dict[str, float]:\n''',
              "add consolidated sensitivity writer",
          )
          text = replace_once(
              text,
              '    primary_folds: list[Path],\n    ablation_folds: list[Path],\n',
              '',
              "remove fold report summary args",
          )
          text = replace_once(
              text,
              '        "schema_version": "investor2.alphazerobeta-empirical-summary.v1",\n',
              '        "schema_version": "investor2.alphazerobeta-empirical-summary.v2",\n',
              "bump summary schema",
          )
          text = replace_once(
              text,
              '        "primary_fold_results": [str(path) for path in primary_folds],\n        "ablation_fold_results": [str(path) for path in ablation_folds],\n',
              '',
              "remove derived fold report pointers",
          )
          text = replace_once(
              text,
              '        "cost_sensitivity": [str(path) for path in sensitivity],\n',
              '        "cost_sensitivity": str(output_dir / "cost_sensitivity.json"),\n',
              "point summary at consolidated sensitivity",
          )
          text = replace_once(
              text,
              '    primary_results: list[Path] = []\n    ablation_results: list[Path] = []\n',
              '',
              "remove derived result lists",
          )
          text = replace_once(
              text,
              '        primary_result = output_dir / f"primary_fold{fold_index}.json"\n'
              '        ablation_result = output_dir / f"ablation_fold{fold_index}.json"\n'
              '        primary_results.append(primary_result)\n'
              '        ablation_results.append(ablation_result)\n',
              '',
              "remove derived result collection",
          )
          text = replace_once(
              text,
              '        source_manifest,\n        primary_results,\n        ablation_results,\n        primary_audits,\n',
              '        source_manifest,\n        primary_audits,\n',
              "remove summary call result args",
          )
          text = replace_once(
              text,
              '        comparison,\n        sensitivity,\n    )\n\n\ndef main() -> None:\n',
              '        comparison,\n        sensitivity,\n    )\n    compact_comparisons(output_dir, comparison, sensitivity)\n\n\ndef main() -> None:\n',
              "compact generated comparisons",
          )
          script_path.write_text(text, encoding="utf-8")

          workflow_path = Path(".github/workflows/alphazerobeta-empirical.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          start = workflow.index("      - name: Recompute aggregate and cost sensitivity\n")
          end = workflow.index("      - name: Verify hashes, summary, and monetary scaling\n", start)
          new_block = '''      - name: Recompute aggregate and cost sensitivity\n        env:\n          PYTHONPATH: .\n        shell: bash\n        run: |\n          set -euo pipefail\n          ROOT=docs/research/results/alphazerobeta_2024\n          DATASET="$ROOT/etf_panel.npz"\n          PRIMARY=("$ROOT/primary_fold0.weights.npz" "$ROOT/primary_fold1.weights.npz")\n          ABLATION=("$ROOT/ablation_fold0.weights.npz" "$ROOT/ablation_fold1.weights.npz")\n\n          python scripts/alphazerobeta_compare.py \\\n            --dataset "$DATASET" \\\n            --primary-weights "${PRIMARY[@]}" \\\n            --ablation-weights "${ABLATION[@]}" \\\n            --output /tmp/alphazerobeta_comparison.json \\\n            --transaction-cost-bps 15 \\\n            --borrow-fee-bps 100\n\n          for trading in 5 15 30; do\n            for borrow in 0 100; do\n              name="comparison_cost_${trading}bps_borrow_${borrow}bps.json"\n              python scripts/alphazerobeta_compare.py \\\n                --dataset "$DATASET" \\\n                --primary-weights "${PRIMARY[@]}" \\\n                --ablation-weights "${ABLATION[@]}" \\\n                --output "/tmp/$name" \\\n                --transaction-cost-bps "$trading" \\\n                --borrow-fee-bps "$borrow"\n            done\n          done\n\n          python - <<'PY2'\n          import json\n          from pathlib import Path\n          root = Path("docs/research/results/alphazerobeta_2024")\n          store = json.loads((root / "cost_sensitivity.json").read_text())\n          assert store["schema_version"] == "investor2.alphazerobeta-cost-sensitivity.v1"\n          expected = {f"{trading}bps_borrow_{borrow}bps" for trading in (5, 15, 30) for borrow in (0, 100)}\n          assert set(store["scenarios"]) == expected\n          default = json.loads(Path("/tmp/alphazerobeta_comparison.json").read_text())\n          assert default == store["scenarios"][store["default_scenario"]]\n          for key, expected_payload in store["scenarios"].items():\n              actual = json.loads(Path(f"/tmp/comparison_cost_{key}.json").read_text())\n              assert actual == expected_payload\n          PY2\n\n'''
          workflow = workflow[:start] + new_block + workflow[end:]
          workflow = replace_once(
              workflow,
              '          comparison = json.loads((root / "alphazerobeta_comparison.json").read_text())\n',
              '          sensitivity = json.loads((root / "cost_sensitivity.json").read_text())\n'
              '          comparison = sensitivity["scenarios"][sensitivity["default_scenario"]]\n',
              "read consolidated default comparison",
          )
          workflow_path.write_text(workflow, encoding="utf-8")

          root = Path("docs/research/results/alphazerobeta_2024")
          scenarios = {}
          for trading in (5, 15, 30):
              for borrow in (0, 100):
                  name = f"comparison_cost_{trading}bps_borrow_{borrow}bps.json"
                  payload = json.loads((root / name).read_text(encoding="utf-8"))
                  scenarios[f"{trading}bps_borrow_{borrow}bps"] = payload
          default_key = "15bps_borrow_100bps"
          default_payload = json.loads((root / "alphazerobeta_comparison.json").read_text(encoding="utf-8"))
          if default_payload != scenarios[default_key]:
              raise SystemExit("existing default comparison differs from 15bps/100bps scenario")
          (root / "cost_sensitivity.json").write_text(
              json.dumps(
                  {
                      "schema_version": "investor2.alphazerobeta-cost-sensitivity.v1",
                      "default_scenario": default_key,
                      "scenarios": scenarios,
                  },
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          summary_path = root / "summary.json"
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          summary["schema_version"] = "investor2.alphazerobeta-empirical-summary.v2"
          summary.pop("primary_fold_results", None)
          summary.pop("ablation_fold_results", None)
          summary["cost_sensitivity"] = str(root / "cost_sensitivity.json")
          summary_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          for name in [
              "primary_fold0.json", "primary_fold1.json", "ablation_fold0.json", "ablation_fold1.json",
              "alphazerobeta_comparison.json",
              "comparison_cost_5bps_borrow_0bps.json", "comparison_cost_5bps_borrow_100bps.json",
              "comparison_cost_15bps_borrow_0bps.json", "comparison_cost_15bps_borrow_100bps.json",
              "comparison_cost_30bps_borrow_0bps.json", "comparison_cost_30bps_borrow_100bps.json",
          ]:
              (root / name).unlink()
          PY
      - name: Verify compact evidence contract
        run: |
          python -m py_compile scripts/alphazerobeta_empirical_run.py
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("docs/research/results/alphazerobeta_2024")
          summary = json.loads((root / "summary.json").read_text())
          store = json.loads((root / "cost_sensitivity.json").read_text())
          assert summary["schema_version"] == "investor2.alphazerobeta-empirical-summary.v2"
          assert summary["cost_sensitivity"] == str(root / "cost_sensitivity.json")
          assert "primary_fold_results" not in summary
          assert "ablation_fold_results" not in summary
          assert store["default_scenario"] == "15bps_borrow_100bps"
          assert len(store["scenarios"]) == 6
          default = store["scenarios"][store["default_scenario"]]
          assert default["primary_lambda_corr_0_5"] == summary["primary_lambda_corr_0_5"]
          assert default["ablation_lambda_corr_0"] == summary["ablation_lambda_corr_0"]
          assert default["gates"] == summary["gates"]
          for name in [
              "primary_fold0.json", "primary_fold1.json", "ablation_fold0.json", "ablation_fold1.json",
              "alphazerobeta_comparison.json",
              "comparison_cost_5bps_borrow_0bps.json", "comparison_cost_5bps_borrow_100bps.json",
              "comparison_cost_15bps_borrow_0bps.json", "comparison_cost_15bps_borrow_100bps.json",
              "comparison_cost_30bps_borrow_0bps.json", "comparison_cost_30bps_borrow_100bps.json",
          ]:
              assert not (root / name).exists(), name
          for name in [
              "etf_panel.npz", "etf_panel.npz.manifest.json", "source_manifest.json", "summary.json",
              "primary_fold0.weights.npz", "primary_fold1.weights.npz",
              "ablation_fold0.weights.npz", "ablation_fold1.weights.npz",
              "primary_fold0.audit.json", "primary_fold1.audit.json",
              "ablation_fold0.audit.json", "ablation_fold1.audit.json",
              "cost_sensitivity.json",
          ]:
              assert (root / name).exists(), name
          PY
          git diff --check
      - name: Commit compact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/alphazerobeta_empirical_run.py .github/workflows/alphazerobeta-empirical.yml docs/research/results/alphazerobeta_2024
          git commit -m "refactor: compact AlphaZeroBeta evidence artifacts"
          git pull --rebase origin main
          git push origin HEAD:main
