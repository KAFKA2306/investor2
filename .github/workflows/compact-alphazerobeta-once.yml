name: Compact AlphaZeroBeta evidence once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compact-alphazerobeta-once.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compact evidence contract
        run: python scripts/compact_alphazerobeta_once.py
      - name: Commit compact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/alphazerobeta_empirical_run.py .github/workflows/alphazerobeta-empirical.yml docs/research/results/alphazerobeta_2024
          git commit -m "refactor: compact AlphaZeroBeta evidence artifacts"
          git pull --rebase origin main
          git push origin HEAD:main
