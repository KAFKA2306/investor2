name: tmp bank ETF primary data PR

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-bank-etf-primary-data-pr.yml'
      - 'tmp-bank-etf-trigger.txt'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official Nomura AM ETF history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp-etf-history
          for code in 1615 1489 1306; do
            curl --fail --location --retry 3 --retry-all-errors \
              "https://www.nomura-am.co.jp/fund/etf/history/ETF_${code}.csv" \
              -o "tmp-etf-history/ETF_${code}.csv"
            test -s "tmp-etf-history/ETF_${code}.csv"
            sha256sum "tmp-etf-history/ETF_${code}.csv"
          done
      - name: Upload primary CSV snapshots
        uses: actions/upload-artifact@v4
        with:
          name: official-etf-history
          path: tmp-etf-history/*.csv
          if-no-files-found: error
          retention-days: 1
