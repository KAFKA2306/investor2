[project]
name = "finance-investor"
version = "0.1.0"
description = "Consolidated finance investor workspace"
readme = "README.md"
requires-python = ">= 3.12"
dependencies = [
    "backoff",
    "matplotlib",
    "numpy",
    "pandas",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "requests",
    "setuptools",
    "tqdm",
    "huggingface-hub[cli]",
    "torch",
    "japanize-matplotlib",
    "matplotlib-fontja",
    "scikit-learn",
    "skfolio==1.0.0",
]

[dependency-groups]
dev = [
    "prek==0.4.11",
    "pyrefly==1.1.1",
    "pytest",
    "ruff",
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
project-excludes = ["**/node_modules", "**/__pycache__", "**/*venv/**", "cache/**"]
search-path = ["."]
python-version = "3.12"
python-platform = "linux"
preset = "strict"
baseline = ".pyrefly-baseline.json"

[tool.pyrefly.errors]
missing-import = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
