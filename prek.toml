[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "biome-check"
name = "Biome format/import check"
language = "system"
entry = "bun run format:check"
files = "\\.(ts|tsx|js|jsx)$"
pass_filenames = false

[[repos.hooks]]
id = "oxlint"
name = "Oxlint"
language = "system"
entry = "bun run lint"
files = "\\.(ts|tsx|js|jsx)$"
pass_filenames = false

[[repos.hooks]]
id = "typescript"
name = "TypeScript strict check"
language = "system"
entry = "bun run typecheck"
files = "\\.(ts|tsx)$"
pass_filenames = false

[[repos.hooks]]
id = "ruff-format"
name = "Ruff format check"
language = "system"
entry = "uv run --no-sync ruff format --check src scripts tests"
files = "\\.py$"
pass_filenames = false

[[repos.hooks]]
id = "ruff-lint"
name = "Ruff lint"
language = "system"
entry = "uv run --no-sync ruff check src scripts tests"
files = "\\.py$"
pass_filenames = false

[[repos.hooks]]
id = "pyrefly"
name = "Pyrefly strict check"
language = "system"
entry = "uv run --no-sync pyrefly check"
files = "\\.py$"
pass_filenames = false
